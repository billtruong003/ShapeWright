# Benchmark: hard-surface + curves. Lathe base, tapered post, swept arm (tube), boolean-cut
# lantern frame, emissive glass. Tests: tube sweep, subtract, emissive materials, sockets.
shapewright: 0.1
asset:
  name: street_lamp
  kind: prop/street/lamp
  description: Stylized old-town street lamp with a hanging lantern.
profile: web
style: stylized_lowpoly
budget: {triangles: 1400}

params:
  height:     {value: 2.6, min: 2.0, max: 3.5}
  post_r:     0.05
  arm_reach:  {value: 0.45, doc: horizontal reach of the arm}
  lantern_w:  0.2
  lantern_h:  0.28
  sides:      8

materials:
  iron:  {base_color: "#2f3236", metallic: 0.7, roughness: 0.5}
  glass: {base_color: "#ffd98a", emissive: "#ffb347", roughness: 0.2, doc: glowing panes}

parts:
  base:
    shape:
      type: lathe
      segments: sides
      profile: [[0, 0], [0.16, 0], [0.16, 0.05], [0.11, 0.09], [0.08, 0.2], [post_r * 1.4, 0.28], [0, 0.28]]
    anchor: bottom
    position: [0, 0, 0]
    material: iron

  post:
    shape: {type: cylinder, radius: post_r, radius_top: post_r * 0.75, height: height - 0.25, segments: sides}
    anchor: bottom
    attach: {to: base, at: top, offset: [0, -0.03, 0]}
    material: iron

  finial:
    shape: {type: cylinder, radius: post_r * 1.1, radius_top: 0, height: 0.12, segments: sides}
    anchor: bottom
    attach: {to: post, at: top, offset: [0, -0.01, 0]}
    material: iron

  arm:
    doc: curled bracket carrying the lantern
    shape:
      type: tube
      radius: 0.018
      sides: 6
      path: [[0, 0, 0], [0, 0.08, 0.12], [0, 0.1, 0.25], [0, 0.06, arm_reach - 0.05], [0, 0, arm_reach]]
    anchor: bottom_back
    attach: {to: post, at: top_front, offset: [0, -0.18, -0.02]}
    material: iron

  lantern_frame:
    doc: box frame with four window openings (boolean cuts)
    shape: {type: chamfer_box, size: [lantern_w, lantern_h, lantern_w], chamfer: 0.012}
    ops:
      - {type: subtract, shape: {type: box, size: [lantern_w * 0.7, lantern_h * 0.72, lantern_w * 1.5]}}
      - {type: subtract, shape: {type: box, size: [lantern_w * 1.5, lantern_h * 0.72, lantern_w * 0.7]}}
    anchor: top
    attach: {to: arm, at: bottom_front, offset: [0, -0.02, -0.02]}
    shading: flat
    material: iron

  glass:
    shape: {type: box, size: [lantern_w * 0.8, lantern_h * 0.8, lantern_w * 0.8]}
    attach: {to: lantern_frame, at: center}
    material: glass

  lantern_cap:
    shape: {type: cylinder, radius: lantern_w * 0.78, radius_top: 0.02, height: 0.1, segments: 4}
    rotate: [0, 45, 0]
    anchor: bottom
    attach: {to: lantern_frame, at: top, offset: [0, -0.005, 0]}
    material: iron

sockets:
  light: {attach: {to: glass, at: center}, doc: point light position}

collision: {mode: box}

checks:
  - {expr: asset.height, min: height - 0.05, max: height + 0.2}
  - {expr: glass.center.z, min: 0.3, doc: lantern hangs clear of the post}
