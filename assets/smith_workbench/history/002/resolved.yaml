shapewright: 0.1
profile: mobile_mid
style: stylized_lowpoly
budget:
  triangles: 1200
  materials: 3
params:
  board_t:
    value: 0.045
    doc: plank thickness for shelves, seats, crate walls
  seam:
    value: 0.008
    doc: gap between neighbouring planks
  leg:
    value: 0.08
    doc: section of every leg / post
  leg_taper:
    value: 0.88
    doc: legs narrow toward the top (foot wider)
  rail:
    value: 0.05
    doc: section of rails / stretchers
  band_w:
    value: 0.045
    doc: iron band width
  band_t:
    value: 0.012
    doc: how far an iron band stands proud of what it wraps
  rivet_r:
    value: 0.011
    doc: rivet head radius
  wear:
    value: 0.004
    doc: hand-made jitter
  bench_h:
    value: 0.85
    doc: workbench top; anvil_stump face is ~0.8
  seat_h:
    value: 0.5
    doc: smith stool seat (a bit taller than a tavern stool)
  length:
    value: 1.5
    min: 1.1
    max: 2.0
  width:
    value: 0.72
    min: 0.55
    max: 0.9
  top_t:
    value: 0.07
    doc: thicker than board_t, a work surface
  overhang: 0.06
  frame_w: length - 2 * overhang
  frame_d: width - 2 * overhang
  shelf_y: 0.16
  bench_leg:
    value: leg * 1.4
    doc: heavier legs than the stool and rack, this bench takes hammering
materials:
  wood:
    base_color: '#9a6a40'
    roughness: 0.85
    doc: boards, planks, staves
  wood_dark:
    base_color: '#5e3b22'
    roughness: 0.9
    doc: legs, rails, battens, brackets
  iron:
    base_color: '#5a5f66'
    metallic: 0.6
    roughness: 0.55
    doc: bands, rivets, handles (same as anvil_stump)
asset:
  name: smith_workbench
  kind: prop/crafting/workbench
  description: Heavy plank-top blacksmith workbench with iron-banded legs and a low shelf (blacksmith workstation pack).
  tags:
  - blacksmith_pack
parts:
  top:
    component: plank_top
    with:
      length: length
      width: width
      thickness: top_t
      planks: 3
      gap: seam
      wear: wear
      batten_from_end: overhang + leg + 0.06
    materials:
      top: wood
      under: wood_dark
    anchor: top
    position:
    - 0
    - bench_h
    - 0
  frame:
    component: leg_frame
    with:
      width: frame_w
      depth: frame_d
      height: bench_h - top_t + 0.004
      leg: bench_leg
      taper: leg_taper
      rail: rail
      rail_y: shelf_y
      side_rails: 1
      long_rails: 0
      aprons: 1
      band_w: band_w
      band_t: band_t
      wear: wear
    materials:
      structure: wood_dark
      metal: iron
    anchor: bottom
    position:
    - 0
    - 0
    - 0
  shelf:
    doc: 'low shelf: planks rest on the side rails, battens hang just inside them (batten 0.04 tall, 0.005 into the planks)'
    component: plank_top
    with:
      length: frame_w - bench_leg
      width: frame_d - 0.02
      thickness: board_t * 0.8
      planks: 2
      gap: seam
      wear: wear
      batten_from_end: rail * 0.5 + 0.045
    materials:
      top: wood
      under: wood_dark
    anchor: bottom
    position:
    - 0
    - shelf_y + rail / 2 - 0.035 - 0.003
    - 0
  strap_l:
    doc: riveted iron strap around the left end of the top
    component: iron_band
    with:
      inner_x: top_t
      inner_z: width
      band_w: band_w
      band_t: band_t
      rivet_r: rivet_r
      rivets: 1
    materials:
      metal: iron
    rotate:
    - 0
    - 0
    - 90
    anchor: center
    position:
    - -(length / 2 - 0.12)
    - bench_h - top_t / 2
    - 0
  strap_r:
    component: iron_band
    with:
      inner_x: top_t
      inner_z: width
      band_w: band_w
      band_t: band_t
      rivet_r: rivet_r
      rivets: 1
    materials:
      metal: iron
    rotate:
    - 0
    - 0
    - 90
    anchor: center
    position:
    - length / 2 - 0.12
    - bench_h - top_t / 2
    - 0
  hammer:
    doc: the same smith_hammer component that leans in the tool crate, lying on the top
    component: smith_hammer
    with:
      handle_len: 0.42
    materials:
      handle: wood
      head: iron
    rotate:
    - 0
    - 0
    - 90
    anchor: bottom
    attach:
      to: top
      at: top
      offset:
      - 0.3
      - -0.003
      - 0.13
sockets:
  work_surface:
    attach:
      to: top
      at: top
    doc: place tools / ingots on the top
collision:
  mode: single_box
checks:
- expr: top.max.y
  min: bench_h - 0.005
  max: bench_h + 0.01
  doc: pack-wide workbench height
- expr: top.max.y - seat_h
  min: 0.3
  max: 0.4
  doc: stool tucks under comfortably
- expr: frame_leg_front_left.min.y
  max: 0.001
  doc: legs reach the floor
