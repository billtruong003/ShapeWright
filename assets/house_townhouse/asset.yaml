# Demo house B (cozy_house kit): a narrow two-storey townhouse, 2 bays wide x 3 deep, gable to the
# street (ridge along z). Ground floor: shopfront + door; upper floor: upper-wall bays; a floor band
# beam between the storeys; chimney on the right side. Same kit as the cottage; nothing unique.
#
# Phase 19b: every piece is a kit MODULE ASSET placed by its own origin with grid arithmetic (like the cottage).
# Orientation rule for wall modules (their outer face is local +z):
#   front z = +D/2: rotate 0 | back z = -D/2: rotate 180 | right x = +W/2: rotate 90 | left x = -W/2: rotate -90
shapewright: 0.1
pack: cozy_house
asset:
  name: house_townhouse
  kind: environment/building/house
  description: Narrow two-storey half-timbered townhouse with a ground-floor shop, assembled from the cozy_house kit.
  tags: [cozy_house, demo_house]
  placement: floor
budget: {triangles: 45000, materials: 7, texture_size: 2048, draw_calls: 7}
uv: {texel_density: 40}
export: {merge: by_material, lods: [0.5, 0.25]}   # Phase 21: LOD1 ~50 %, LOD2 ~25 % of the triangles
collision: {mode: single_box}

params:
  nx: {value: 2, doc: bays along x (street frontage)}
  nz: {value: 3, doc: bays along z (depth; ridge direction)}
  W:  nx * bay
  D:  nz * bay
  x0: -W / 2
  z0: -D / 2
  y0: base_h - sink                     # ground storey walls/posts start
  y1: lv1 - sink                        # upper storey walls/posts start
  y_top: lv2 - sink                     # top of upper posts and top band = roof bearing
  run: W / 2 + wall_t / 2 + eave
  y_roof: y_top - eave * tan(pitch)
  ridge_y: y_roof + run * tan(pitch) + roof_t / cos(pitch) + shingle_t * 0.35
  verge_z: D / 2 + (verge + wall_t / 2) / 2
  band_off: wall_t / 4                  # the floor band fills the OUTER half of the wall line

parts:
  # ---------------------------------------------------------------- footing, corners (stone + ground post), upper posts, decks
  footing_fb:   {asset: house_footing, position: [x0 + bay / 2, 0, D / 2], array: [{count: nx, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  footing_side: {asset: house_footing, rotate: [0, 90, 0], position: [x0, 0, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]}
  node_fb:      {asset: house_corner, position: [x0, 0, D / 2], array: [{count: nx + 1, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  node_side:    {asset: house_corner, position: [x0, 0, z0 + bay], array: [{count: nz - 1, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]}
  post_fb:      {asset: house_post, position: [x0, y1, D / 2], array: [{count: nx + 1, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  post_side:    {asset: house_post, position: [x0, y1, z0 + bay], array: [{count: nz - 1, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]}
  deck_ground:  {asset: house_floor, position: [x0 + bay / 2, base_h - floor_t, z0 + bay / 2], array: [{count: nx, offset: [bay, 0, 0]}, {count: nz, offset: [0, 0, bay]}]}
  deck_upper:   {asset: house_floor, position: [x0 + bay / 2, lv1 - floor_t, z0 + bay / 2], array: [{count: nx, offset: [bay, 0, 0]}, {count: nz, offset: [0, 0, bay]}]}

  # ---------------------------------------------------------------- band beams: floor band (outer half of the wall line), top band
  floor_band_fb:   {asset: house_beam, with: {depth: wall_t / 2, seed: 5}, position: [x0 + bay / 2, lv1 - floor_t + band_h / 2, D / 2 + band_off], array: [{count: nx, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D - 2 * band_off]}]}
  floor_band_side: {asset: house_beam, with: {depth: wall_t / 2, seed: 7}, rotate: [0, 90, 0], position: [x0 - band_off, lv1 - floor_t + band_h / 2, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W + 2 * band_off, 0, 0]}]}
  top_band_fb:     {asset: house_beam, with: {seed: 8}, position: [x0 + bay / 2, y_top - band_h / 2, D / 2], array: [{count: nx, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  top_band_side:   {asset: house_beam, with: {seed: 9}, rotate: [0, 90, 0], position: [x0, y_top - band_h / 2, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]}

  # ---------------------------------------------------------------- ground floor: shop + door to the street, windows behind and in the middle side bays
  shop:        {asset: house_wall_shopfront, with: {seed: 1}, position: [x0 + bay / 2, y0, D / 2]}
  door_wall:   {asset: house_wall_door, with: {seed: 2}, position: [x0 + 1.5 * bay, y0, D / 2]}
  ground_back: {asset: house_wall_window, with: {shutters: 0, seed: 3}, rotate: [0, 180, 0], position: [x0 + bay / 2, y0, -D / 2], array: {count: nx, offset: [bay, 0, 0]}}
  ground_side: {asset: house_wall_plain, with: {seed: 4}, rotate: [0, 90, 0], position: [x0, y0, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay], skip: [1]}, {count: 2, offset: [W, 0, 0]}]}
  ground_side_window: {asset: house_wall_window, with: {shutters: 0, size: 0, seed: 5}, rotate: [0, 90, 0], position: [x0, y0, 0], array: {count: 2, offset: [W, 0, 0]}}

  # ---------------------------------------------------------------- upper floor
  upper_front: {asset: house_wall_upper, with: {seed: 11}, position: [x0 + bay / 2, y1, D / 2], array: {count: nx, offset: [bay, 0, 0]}}
  upper_back:  {asset: house_wall_plain, with: {seed: 12}, rotate: [0, 180, 0], position: [x0 + bay / 2, y1, -D / 2], array: {count: nx, offset: [bay, 0, 0]}}
  upper_side:  {asset: house_wall_upper, with: {seed: 13}, rotate: [0, 90, 0], position: [x0, y1, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]}

  # ---------------------------------------------------------------- roof: ridge along z, gables to the street and the yard
  roof_right: {asset: house_roof_section, with: {deep: nx}, rotate: [0, 90, 0], position: [0, y_roof, z0 + bay / 2], array: {count: nz, offset: [0, 0, bay]}}
  roof_left:  {asset: house_roof_section, with: {deep: nx}, rotate: [0, -90, 0], position: [0, y_roof, z0 + bay / 2], array: {count: nz, offset: [0, 0, bay]}}
  verge_front_right: {asset: house_roof_end, with: {deep: nx, left: 1}, rotate: [0, 90, 0], position: [0, y_roof, verge_z]}
  verge_front_left:  {asset: house_roof_end, with: {deep: nx}, rotate: [0, -90, 0], position: [0, y_roof, verge_z]}
  verge_back_right:  {asset: house_roof_end, with: {deep: nx}, rotate: [0, 90, 0], position: [0, y_roof, -verge_z]}
  verge_back_left:   {asset: house_roof_end, with: {deep: nx, left: 1}, rotate: [0, -90, 0], position: [0, y_roof, -verge_z]}
  gable: {asset: house_gable, with: {deep: nx}, rotate: [0, 90, 0], position: [0, y_top, z0], array: {count: 2, offset: [0, 0, D]}}
  ridge: {asset: house_ridge, with: {length: D + 2 * verge + wall_t}, rotate: [0, 90, 0], position: [0, ridge_y - 0.03, 0]}

  # ---------------------------------------------------------------- extras
  chimney:
    doc: outside the right side wall at the back bay; passes the eave and clears the ridge
    asset: house_chimney
    with: {height: ridge_y + 0.6, shoulder: y1 - 0.3}
    rotate: [0, -90, 0]
    position: [W / 2 + wall_t / 2 + 0.35, 0, z0 + bay / 2]
  steps: {asset: house_steps, position: [x0 + 1.5 * bay, 0, D / 2 + footing_d / 2]}

sockets:
  entrance: {attach: {to: origin, offset: [x0 + 1.5 * bay, base_h, D / 2 + 0.6]}, doc: in front of the door}
  shop_counter: {attach: {to: origin, offset: [x0 + bay / 2, base_h + shop_sill, D / 2 + 0.3]}, doc: customers stand here}
