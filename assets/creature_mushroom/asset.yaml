# Mushroom creature: a stubby stem body with a domed cap (the underside carved hollow), little feet; the white
# spots and the face are painted decals (Phase 23); spots as geometry were sharp pyramids at this budget.
shapewright: 0.1
asset:
  name: creature_mushroom
  kind: character/creature/mushroom
  description: Mushroom creature with a spotted cap, one blended organic mesh.
  tags: [creature, organic, mushroom]
  placement: floor
profile: desktop_indie
budget: {triangles: 4000, materials: 4}

params:
  cap_r: {value: 0.26, doc: cap radius}
  cap_y: {value: 0.42, doc: height of the cap's rim}

materials:
  cap:   {base_color: '#c8423a', roughness: 0.6}
  spot:  {base_color: '#f4efe4', roughness: 0.7}
  stem:  {base_color: '#efe2c4', roughness: 0.8}
  eye:   {base_color: '#1d1f24', roughness: 0.2}

parts:
  body:
    material: stem
    origin: keep
    shape:
      type: blend
      radius: 0.03
      triangles: 3600
      ground: true
      items:
        - {sdf: ellipsoid, center: [0, cap_y, 0], radii: [cap_r, cap_r * 0.75, cap_r], blend: 0.02, material: cap, doc: cap dome}
        - {sdf: ellipsoid, center: [0, cap_y - 0.12, 0], radii: [cap_r * 0.86, cap_r * 0.62, cap_r * 0.86], op: subtract, blend: 0.03, doc: hollow underside (deep enough to leave no thin bowl under it)}
        - {sdf: cone, a: [0, 0.12, 0], b: [0, cap_y, 0], radius_a: 0.13, radius_b: 0.1, doc: stem}
        - {sdf: ellipsoid, center: [0.06, 0.04, 0.03], radii: [0.06, 0.04, 0.075], mirror: x, doc: feet}
        - {sdf: sphere, center: [0, cap_y, 0], radius: 0.1, blend: 0.03, doc: stem top under the cap}
      decals:
        - {kind: disc, at: [0, cap_y + cap_r * 0.75, 0], toward: [0, 1, 0], size: 0.05, color: '#f4efe4', doc: top spot}
        - {kind: disc, at: [0.16, cap_y + cap_r * 0.42, 0.13], toward: [0.6, 0.55, 0.5], size: 0.04, color: '#f4efe4', mirror: x, doc: front spots}
        - {kind: disc, at: [0.2, cap_y + cap_r * 0.3, -0.12], toward: [0.7, 0.4, -0.5], size: 0.035, color: '#f4efe4', mirror: x, doc: back spots}
        - {kind: disc, at: [0, cap_y + cap_r * 0.5, -0.18], toward: [0, 0.5, -0.8], size: 0.04, color: '#f4efe4', doc: back spot}
        - {kind: eye, at: [0.045, 0.27, 0.11], toward: [0.25, 0, 1], size: 0.02, mirror: x, doc: eyes}
        - {kind: smile, at: [0, 0.225, 0.115], toward: [0, 0, 1], size: 0.018, color: '#5a3a2a', doc: mouth}
