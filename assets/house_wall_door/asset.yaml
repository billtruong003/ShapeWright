# cozy_house kit module 4: wall bay with a door
# The door steps over the wall's sill plate (threshold); frame and ledged plank door.
shapewright: 0.1
pack: cozy_house
asset:
  name: house_wall_door
  kind: environment/modular/wall
  description: Half-timbered wall bay with a framed plank door (cozy_house kit).
  tags: [cozy_house, module, wall]
  placement: floor
export: {merge: by_material}
collision: {mode: single_box}

params:
  seed: {value: 0, doc: jitter seed offset}

parts:
  wall:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 2, op_w: door_w, op_h: door_h + sink, seed: seed}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [0, 0, 0]
  door_frame:
    component: house_door_frame
    with: {w: door_w, h: door_h + sink - timber, depth: wall_t, frame: door_frame}
    materials: {timber: timber}
    origin: keep
    position: [0, timber, 0]
  door:
    component: house_door
    with: {w: door_w - 2 * door_frame - 0.012, h: door_h + sink - timber - door_frame * 1.3 - 0.008}
    materials: {planks: planks, timber: timber, iron: iron}
    origin: keep
    position: [0, timber + 0.004, -0.03]
