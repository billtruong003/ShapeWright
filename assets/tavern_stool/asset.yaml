# Asset family demo: a stool is a tavern_chair with has_back = false.
# The variant only sets public params from the chair's `interface`; it knows
# nothing about how the chair is built. (v0.1 overrode rear_leg's ops, anchor
# and rotation here and repurposed back_height: see docs/DESIGN_REVIEW.md #6.)
shapewright: 0.1
extends: ../tavern_chair
asset:
  name: tavern_stool
  kind: prop/furniture/stool
  description: Backless tavern stool from the same set as tavern_chair.
budget: {triangles: 450}

params:
  has_back: false
  seat_width: 0.38
  seat_depth: 0.36
  rear_splay: 3

checks:                     # added to the family's checks
  - {expr: asset.height, max: 0.5, doc: no backrest}
