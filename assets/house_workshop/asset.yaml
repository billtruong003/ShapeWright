# Demo house C (cozy_house kit): an asymmetric workshop-tavern. A two-storey main block (3 x 2 bays,
# tavern door, ridge along x) with a one-storey workshop wing (2 x 2 bays, shopfront + wide door)
# attached on its right. The wing's roof butts into the main block's side wall, and the wing has NO
# posts, footing or wall on the shared grid line (the main block's are there): nothing is doubled.
#
# Plan (x): main block A0..A1, wing A1..A2; both span z in [-D/2, D/2].
# Phase 19b: every piece is a kit MODULE ASSET placed with grid arithmetic (like the cottage).
shapewright: 0.1
pack: cozy_house
asset:
  name: house_workshop
  kind: environment/building/house
  description: Asymmetric two-storey tavern with a one-storey workshop wing, assembled from the cozy_house kit.
  tags: [cozy_house, demo_house]
  placement: floor
budget: {triangles: 60000, materials: 7, texture_size: 2048, draw_calls: 7}
uv: {texel_density: 30}
export: {merge: by_material}
collision: {mode: single_hull}

params:
  nm: {value: 3, doc: main block bays along x}
  nw: {value: 2, doc: wing bays along x}
  nz: {value: 2, doc: bays along z (both blocks)}
  A0: -(nm + nw) * bay / 2
  A1: A0 + nm * bay
  A2: A1 + nw * bay
  D:  nz * bay
  z0: -D / 2
  y0: base_h - sink
  y1: lv1 - sink
  ytm: lv2 - sink                        # main roof bearing
  ytw: lv1 - sink                        # wing roof bearing
  run: D / 2 + wall_t / 2 + eave
  yrm: ytm - eave * tan(pitch)
  yrw: ytw - eave * tan(pitch)
  ridge_m: yrm + run * tan(pitch) + roof_t / cos(pitch) + shingle_t * 0.35
  ridge_w: yrw + run * tan(pitch) + roof_t / cos(pitch) + shingle_t * 0.35
  verge_len: verge + wall_t / 2
  band_off: wall_t / 4

parts:
  # ================================================================ footings, corner nodes (stone + ground post), upper posts, decks
  footing_fb:    {asset: house_footing, position: [A0 + bay / 2, 0, D / 2], array: [{count: nm + nw, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  footing_sides: {asset: house_footing, rotate: [0, 90, 0], position: [A0, 0, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [nm * bay, 0, 0]}]}
  footing_end:   {asset: house_footing, rotate: [0, 90, 0], position: [A2, 0, z0 + bay / 2], array: {count: nz, offset: [0, 0, bay]}}
  node_fb:       {asset: house_corner, position: [A0, 0, D / 2], array: [{count: nm + nw + 1, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  node_mid:      {asset: house_corner, position: [A0, 0, 0], array: {count: 2, offset: [nm * bay, 0, 0]}}
  node_mid_end:  {asset: house_corner, position: [A2, 0, 0]}
  post_m_fb:     {asset: house_post, position: [A0, y1, D / 2], array: [{count: nm + 1, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  post_m_mid:    {asset: house_post, position: [A0, y1, 0], array: {count: 2, offset: [nm * bay, 0, 0]}}
  deck_ground:   {asset: house_floor, position: [A0 + bay / 2, base_h - floor_t, z0 + bay / 2], array: [{count: nm + nw, offset: [bay, 0, 0]}, {count: nz, offset: [0, 0, bay]}]}
  deck_upper:    {asset: house_floor, position: [A0 + bay / 2, lv1 - floor_t, z0 + bay / 2], array: [{count: nm, offset: [bay, 0, 0]}, {count: nz, offset: [0, 0, bay]}]}

  # ================================================================ bands
  floor_band_m_fb:    {asset: house_beam, with: {depth: wall_t / 2, seed: 5}, position: [A0 + bay / 2, lv1 - floor_t + band_h / 2, D / 2 + band_off], array: [{count: nm, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D - 2 * band_off]}]}
  floor_band_m_left:  {asset: house_beam, with: {depth: wall_t / 2, seed: 6}, rotate: [0, 90, 0], position: [A0 - band_off, lv1 - floor_t + band_h / 2, z0 + bay / 2], array: {count: nz, offset: [0, 0, bay]}}
  floor_band_m_right:
    doc: on the shared line the wing's roof bears there; the main block's floor band sits on the inner half
    asset: house_beam
    with: {depth: wall_t / 2, seed: 7}
    rotate: [0, 90, 0]
    position: [A1 - band_off, lv1 - floor_t + band_h / 2, z0 + bay / 2]
    array: {count: nz, offset: [0, 0, bay]}
  top_band_m_fb:   {asset: house_beam, with: {seed: 8}, position: [A0 + bay / 2, ytm - band_h / 2, D / 2], array: [{count: nm, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  top_band_m_side: {asset: house_beam, with: {seed: 9}, rotate: [0, 90, 0], position: [A0, ytm - band_h / 2, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [nm * bay, 0, 0]}]}
  top_band_w_fb:   {asset: house_beam, with: {seed: 10}, position: [A1 + bay / 2, ytw - band_h / 2, D / 2], array: [{count: nw, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  top_band_w_end:  {asset: house_beam, with: {seed: 11}, rotate: [0, 90, 0], position: [A2, ytw - band_h / 2, z0 + bay / 2], array: {count: nz, offset: [0, 0, bay]}}

  # ================================================================ main block (tavern)
  m_front_window: {asset: house_wall_window, with: {shutters: 0, size: 2, seed: 1}, position: [A0 + bay / 2, y0, D / 2], array: {count: 2, offset: [2 * bay, 0, 0]}}
  m_front_door:   {asset: house_wall_door, with: {seed: 2}, position: [A0 + 1.5 * bay, y0, D / 2]}
  m_back:         {asset: house_wall_plain, with: {seed: 3}, rotate: [0, 180, 0], position: [A0 + bay / 2, y0, -D / 2], array: {count: nm, offset: [bay, 0, 0]}}
  m_left:         {asset: house_wall_plain, with: {seed: 4}, rotate: [0, -90, 0], position: [A0, y0, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [0, storey, 0]}]}
  m_right_inner:
    doc: ground floor on the shared line is an inner wall between the tavern and the workshop, with a bare door opening
    asset: house_wall_door
    with: {leaf: 0, seed: 5}
    rotate: [0, 90, 0]
    position: [A1, y0, z0 + bay / 2]
  m_right_inner_plain: {asset: house_wall_plain, with: {seed: 6}, rotate: [0, 90, 0], position: [A1, y0, z0 + 1.5 * bay]}
  m_upper_front: {asset: house_wall_upper, with: {seed: 11}, position: [A0 + bay / 2, y1, D / 2], array: {count: nm, offset: [bay, 0, 0]}}
  m_upper_back:  {asset: house_wall_window, with: {shutters: 0, seed: 12}, rotate: [0, 180, 0], position: [A0 + bay / 2, y1, -D / 2], array: {count: nm, offset: [bay, 0, 0]}}
  m_upper_right: {asset: house_wall_plain, with: {seed: 13}, rotate: [0, 90, 0], position: [A1, y1, z0 + bay / 2], array: {count: nz, offset: [0, 0, bay]}}

  # ================================================================ wing (workshop)
  w_front_shop: {asset: house_wall_shopfront, with: {seed: 21}, position: [A1 + bay / 2, y0, D / 2]}
  w_front_door: {asset: house_wall_door, with: {seed: 22}, position: [A1 + 1.5 * bay, y0, D / 2]}
  w_back:       {asset: house_wall_window, with: {shutters: 0, seed: 23}, rotate: [0, 180, 0], position: [A1 + bay / 2, y0, -D / 2], array: {count: nw, offset: [bay, 0, 0]}}
  w_right:      {asset: house_wall_plain, with: {seed: 24}, rotate: [0, 90, 0], position: [A2, y0, z0 + bay / 2], array: {count: nz, offset: [0, 0, bay]}}

  # ================================================================ roofs
  roof_m_front: {asset: house_roof_section, with: {deep: nz}, position: [A0 + bay / 2, yrm, 0], array: {count: nm, offset: [bay, 0, 0]}}
  roof_m_back:  {asset: house_roof_section, with: {deep: nz}, rotate: [0, 180, 0], position: [A0 + bay / 2, yrm, 0], array: {count: nm, offset: [bay, 0, 0]}}
  verge_m_left:       {asset: house_roof_end, with: {deep: nz, left: 1}, position: [A0 - verge_len / 2, yrm, 0]}
  verge_m_left_back:  {asset: house_roof_end, with: {deep: nz}, rotate: [0, 180, 0], position: [A0 - verge_len / 2, yrm, 0]}
  verge_m_right:      {asset: house_roof_end, with: {deep: nz}, position: [A1 + verge_len / 2, yrm, 0]}
  verge_m_right_back: {asset: house_roof_end, with: {deep: nz, left: 1}, rotate: [0, 180, 0], position: [A1 + verge_len / 2, yrm, 0]}
  gable_m: {asset: house_gable, with: {deep: nz}, position: [A0, ytm, 0], array: {count: 2, offset: [nm * bay, 0, 0]}}
  ridge_m: {asset: house_ridge, with: {length: nm * bay + 2 * verge_len}, position: [(A0 + A1) / 2, ridge_m - 0.03, 0]}
  roof_w_front:
    doc: the wing roof starts on the shared grid line; its first half wall-depth runs into the main block's wall (hidden)
    asset: house_roof_section
    with: {deep: nz}
    position: [A1 + bay / 2, yrw, 0]
    array: {count: nw, offset: [bay, 0, 0]}
  roof_w_back:  {asset: house_roof_section, with: {deep: nz}, rotate: [0, 180, 0], position: [A1 + bay / 2, yrw, 0], array: {count: nw, offset: [bay, 0, 0]}}
  verge_w:      {asset: house_roof_end, with: {deep: nz}, position: [A2 + verge_len / 2, yrw, 0]}
  verge_w_back: {asset: house_roof_end, with: {deep: nz, left: 1}, rotate: [0, 180, 0], position: [A2 + verge_len / 2, yrw, 0]}
  gable_w: {asset: house_gable, with: {deep: nz}, position: [A2, ytw, 0]}
  ridge_w: {asset: house_ridge, with: {length: nw * bay + verge_len}, position: [A1 + (nw * bay + verge_len) / 2, ridge_w - 0.03, 0]}

  # ================================================================ extras
  chimney: {asset: house_chimney, with: {height: ridge_m + 0.7, shoulder: y1 - 0.3}, rotate: [0, 90, 0], position: [A0 - wall_t / 2 - 0.35, 0, 0]}
  steps:   {asset: house_steps, position: [A0 + 1.5 * bay, 0, D / 2 + footing_d / 2], array: {count: 2, offset: [nm * bay, 0, 0]}}
