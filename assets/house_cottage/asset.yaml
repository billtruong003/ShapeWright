# Demo house A (cozy_house kit): a small one-storey cottage, 3 x 2 bays, gable roof along x,
# door in the middle of the front, windows either side and on the back, chimney on the right gable.
#
# Phase 19: the house instances the kit's MODULE ASSETS (`asset: house_wall_window`), not the components
# underneath them. Every piece is placed by its own origin with grid arithmetic on pack params:
# node i at x = x0 + i * bay; walls on grid lines between nodes; storey level y_wall.
shapewright: 0.1
pack: cozy_house
asset:
  name: house_cottage
  kind: environment/building/house
  description: One-storey half-timbered cottage assembled from the cozy_house modular kit.
  tags: [cozy_house, demo_house]
  placement: floor
budget: {triangles: 30000, materials: 7, texture_size: 2048, draw_calls: 7}
uv: {texel_density: 48}
export: {merge: by_material, lods: [0.5, 0.25]}   # Phase 21: LOD1 ~50 %, LOD2 ~25 % of the triangles
collision: {mode: single_box}

params:
  nx: {value: 3, doc: bays along x (ridge direction)}
  nz: {value: 2, doc: bays along z}
  W:  nx * bay
  D:  nz * bay
  x0: -W / 2
  z0: -D / 2
  y_wall: base_h - sink                 # walls and posts start here (ground storey)
  y_top: base_h + storey - sink         # top of posts and top band = roof bearing height
  run: D / 2 + wall_t / 2 + eave        # roof: ridge plumb line -> eave end
  y_roof: y_top - eave * tan(pitch)     # roof origin height (underside at the eave end)
  ridge_y: y_roof + run * tan(pitch) + roof_t / cos(pitch) + shingle_t * 0.35
  verge_x: W / 2 + (verge + wall_t / 2) / 2

parts:
  # ---------------------------------------------------------------- footing, corners, deck
  foundation:   {asset: house_foundation, with: {nx: nx, nz: nz, door_bay: 1}, position: [0, 0, 0]}   # footings, corner nodes, ground deck, entrance steps

  # ---------------------------------------------------------------- top band (wall plate) between posts
  band_fb:   {asset: house_beam, position: [x0 + bay / 2, y_top - band_h / 2, D / 2], array: [{count: nx, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]}
  band_side: {asset: house_beam, rotate: [0, 90, 0], position: [x0, y_top - band_h / 2, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]}

  # ---------------------------------------------------------------- walls (openings, shutters, doors come with their modules)
  wall_front_window: {asset: house_wall_window, position: [x0 + bay / 2, y_wall, D / 2], array: {count: 2, offset: [2 * bay, 0, 0]}}
  wall_front_door:   {asset: house_wall_door, with: {seed: 10}, position: [x0 + 1.5 * bay, y_wall, D / 2]}
  wall_back:  {asset: house_wall_window, with: {shutters: 0, seed: 20}, rotate: [0, 180, 0], position: [x0 + bay / 2, y_wall, -D / 2], array: {count: nx, offset: [bay, 0, 0]}}
  wall_side:  {asset: house_wall_plain, with: {seed: 30}, rotate: [0, 90, 0], position: [x0, y_wall, z0 + bay / 2], array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]}

  # ---------------------------------------------------------------- roof
  roof_front: {asset: house_roof_section, with: {deep: nz}, position: [x0 + bay / 2, y_roof, 0], array: {count: nx, offset: [bay, 0, 0]}}
  roof_back:  {asset: house_roof_section, with: {deep: nz}, rotate: [0, 180, 0], position: [x0 + bay / 2, y_roof, 0], array: {count: nx, offset: [bay, 0, 0]}}
  verge:        {asset: house_roof_end, with: {deep: nz}, position: [verge_x, y_roof, 0]}
  verge_back:   {asset: house_roof_end, with: {deep: nz, left: 1}, rotate: [0, 180, 0], position: [verge_x, y_roof, 0]}
  verge_l:      {asset: house_roof_end, with: {deep: nz, left: 1}, position: [-verge_x, y_roof, 0]}
  verge_l_back: {asset: house_roof_end, with: {deep: nz}, rotate: [0, 180, 0], position: [-verge_x, y_roof, 0]}
  gable: {asset: house_gable, with: {deep: nz}, position: [x0, y_top, 0], array: {count: 2, offset: [W, 0, 0]}}
  ridge: {asset: house_ridge, with: {length: W + 2 * verge + wall_t}, position: [0, ridge_y - 0.03, 0]}

  # ---------------------------------------------------------------- extras
  chimney:
    doc: against the right gable wall, outside; rises through the verge overhang and clears the ridge
    asset: house_chimney
    with: {height: ridge_y + 0.7, shoulder: y_top - 0.3}
    measure:
      gable_r: {bounds: gable_1}
    rotate: [0, -90, 0]
    position: [gable_r.max.x + 0.35, 0, 0]

sockets:
  entrance: {attach: {to: origin, offset: [x0 + 1.5 * bay, base_h, D / 2 + 0.6]}, doc: in front of the door}
