# Two-handed battle axe, standing upright (haft along +Y, butt cap on the ground,
# blade faces toward +Z/-Z, cutting edges toward +X and -X).
# Head: a symmetric double-bit crescent built by CSG, no hand-computed outline:
#   lens   = intersection of two big discs (each disc supplies one convex cutting edge)
#   crescent = lens minus an elliptical cut above and below the eye (concave top/bottom
#              edges that sweep out into horns)
#   bevel  = intersection with a flattened diamond prism (thick at the eye, thin at the edges)
#            and a slab (flat cheeks near the eye).
# Haft: tapered wooden cylinder with two leather grip zones (sleeve + helix wrap cord),
# iron socket collar holding the head, a top spike and a butt cap.
shapewright: 0.1
asset:
  name: battle_axe
  kind: prop/weapon/axe
  description: Stylized low-poly two-handed battle axe with a crescent double-bit head, long wooden haft, leather grip wraps and a top spike.
  placement: free
profile: desktop_indie
style: stylized_lowpoly
budget: {triangles: 1000, materials: 3}

params:
  haft_len:   {value: 1.2, min: 1.0, max: 1.5, doc: haft length (two-handed)}
  haft_r:     {value: 0.02, doc: haft radius at the butt}
  edge_x:     {value: 0.22, min: 0.16, max: 0.3, doc: distance from haft axis to each cutting edge}
  edge_r:     {value: 0.3, doc: radius of the convex cutting-edge arc (bigger = flatter edge)}
  neck:       {value: 0.04, doc: half-height of the head where it meets the eye}
  cut_rx:     {value: 0.185, doc: horizontal half-width of the concave top/bottom cuts (horns start beyond it)}
  cut_ry:     {value: 0.13, doc: vertical radius of the concave cuts}
  head_t:     {value: 0.034, doc: flat cheek thickness of the head}
  bevel_t:    {value: 0.075, doc: diamond thickness at the axis (sets the bevel angle)}
  collar_r:   {value: 0.036}
  collar_h:   {value: 0.13}
  spike_h:    {value: 0.14}
  head_drop:  {value: 0.08, doc: head centre below the haft top}
  grip_r:     {value: 0.024, doc: leather sleeve radius}
  grip_low_l: {value: 0.26, doc: lower grip length}
  grip_up_l:  {value: 0.2, doc: upper grip length}
  grip_gap:   {value: 0.3, doc: bare wood between the two grips}

materials:
  steel:   {base_color: "#a9b3bd", metallic: 0.85, roughness: 0.4}
  wood:    {base_color: "#8a5a36", roughness: 0.85}
  leather: {base_color: "#4e3120", roughness: 0.9}

parts:
  butt_cap:
    doc: iron butt cap (octagonal, faceted)
    shape:
      type: lathe
      segments: 8
      profile: [[0, 0], [haft_r * 1.2, 0], [haft_r * 1.55, 0.02], [haft_r * 1.3, 0.045], [0, 0.045]]
    anchor: bottom
    position: [0, 0, 0]
    shading: flat
    material: steel

  haft:
    doc: long wooden haft, slightly thicker toward the head
    shape: {type: cylinder, radius: haft_r, radius_top: haft_r * 1.15, height: haft_len, segments: 8}
    anchor: bottom
    attach: {to: butt_cap, at: top, offset: [0, -0.02, 0]}
    material: wood

  grip_low:
    doc: lower leather grip sleeve
    shape: {type: cylinder, radius: grip_r, height: grip_low_l, segments: 8}
    anchor: bottom
    attach: {to: butt_cap, at: top, offset: [0, 0.01, 0]}
    material: leather

  grip_up:
    doc: upper leather grip sleeve (the second hand)
    shape: {type: cylinder, radius: grip_r * 1.04, height: grip_up_l, segments: 8}
    anchor: bottom
    attach: {to: grip_low, at: top, offset: [0, grip_gap, 0]}
    material: leather

  wrap_low:
    doc: spiral leather cord wound over the lower grip
    shape:
      type: tube
      radius: 0.0055
      sides: 3
      path: [{helix: {radius: grip_r, pitch: grip_low_l / 5, turns: 4.5, axis: y, segments_per_turn: 6}}]
    anchor: bottom
    attach: {to: grip_low, at: bottom, offset: [0, 0.008, 0]}
    tags: [thin_ok]
    material: leather

  wrap_up:
    doc: spiral leather cord wound over the upper grip
    shape:
      type: tube
      radius: 0.0055
      sides: 3
      path: [{helix: {radius: grip_r * 1.04, pitch: grip_up_l / 4, turns: 3.5, axis: y, segments_per_turn: 6}}]
    anchor: bottom
    attach: {to: grip_up, at: bottom, offset: [0, 0.008, 0]}
    tags: [thin_ok]
    material: leather

  collar:
    doc: iron socket (eye) that the haft passes through; holds the head
    shape: {type: cylinder, radius: collar_r, height: collar_h, segments: 8, chamfer: 0.006}
    anchor: center
    attach: {to: haft, at: top, offset: [0, -head_drop, 0]}
    shading: flat
    material: steel

  head:
    doc: crescent double-bit head (CSG, see file header)
    shape:
      type: boolean
      operation: intersection
      base:
        type: boolean
        operation: difference
        base:
          type: boolean
          operation: intersection
          base:  {type: cylinder, radius: edge_r, height: 0.2, segments: 36, rotate: [90, 0, 0], translate: [edge_x - edge_r, 0, 0]}
          tools: [{type: cylinder, radius: edge_r, height: 0.2, segments: 36, rotate: [90, 0, 0], translate: [edge_r - edge_x, 0, 0]}]
        tools:
          - {type: cylinder, radius: 1, height: 0.3, segments: 24, ops: [{type: scale, factor: [cut_rx, 1, cut_ry]}], rotate: [90, 0, 0], translate: [0, neck + cut_ry, 0]}
          - {type: cylinder, radius: 1, height: 0.3, segments: 24, ops: [{type: scale, factor: [cut_rx, 1, cut_ry]}], rotate: [90, 0, 0], translate: [0, -neck - cut_ry, 0]}
      tools:
        - {type: box, size: [(edge_x + 0.012) * sqrt(2), 1, (edge_x + 0.012) * sqrt(2)],
           ops: [{type: rotate, angles: [0, 45, 0]}, {type: scale, factor: [1, 1, bevel_t / (2 * (edge_x + 0.012))]}]}
        - {type: box, size: [1, 1, head_t]}
    anchor: center
    attach: {to: collar, at: center}
    shading: flat
    tags: [thin_ok]
    material: steel

  spike:
    doc: four-sided top spike
    shape: {type: cylinder, radius: collar_r * 0.95, radius_top: 0, height: spike_h, segments: 4}
    rotate: [0, 45, 0]
    anchor: bottom
    attach: {to: collar, at: top, offset: [0, -0.004, 0]}
    shading: flat
    material: steel

sockets:
  grip_main: {attach: {to: grip_low, at: center}, doc: rear hand}
  grip_off:  {attach: {to: grip_up, at: center}, doc: front hand}

collision: {mode: box}

checks:
  - {expr: asset.height, min: 1.2, max: 1.6, doc: two-handed length}
  - {expr: head.size.x, min: 0.36, max: 0.6, doc: wide double-bit head}
  - {expr: head.size.y / head.size.x, min: 0.45, max: 1.0, doc: crescent bits taller than the neck}
  - {expr: grip_up.max.y < collar.min.y - 0.15, doc: upper grip leaves bare haft below the head}
  - {expr: spike.max.y > head.max.y, doc: spike rises above the horns}
