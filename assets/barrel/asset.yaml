# Benchmark: revolved body (lathe), rings (torus), radial repetition, lid detail.
# Tests: profile modelling, curved silhouettes, smoothing groups, radial arrays.
shapewright: 0.1
asset:
  name: barrel
  kind: prop/container/barrel
  description: Stylized oak barrel with iron hoops and a lid plank seam.
profile: mobile_mid
style: stylized_lowpoly
budget: {triangles: 800}

params:
  height:  {value: 0.9, min: 0.6, max: 1.2}
  radius:  {value: 0.3, doc: radius at the ends}
  bulge:   {value: 0.055, doc: extra radius at the belly}
  sides:   {value: 12, doc: segments around; low-poly look}
  hoop_t:  0.018
  hoop_w:  0.05
  rim:     0.025

materials:
  oak:  {base_color: "#a0703f", roughness: 0.85}
  iron: {base_color: "#4a4d52", metallic: 0.6, roughness: 0.55}

parts:
  body:
    doc: bulging staves, recessed ends
    shape:
      type: lathe
      segments: sides
      profile:
        - [0, rim]
        - [radius - rim, rim]
        - [radius - rim * 0.4, 0]
        - [radius, 0.02]
        - [radius + bulge * 0.7, height * 0.25]
        - [radius + bulge, height * 0.5]
        - [radius + bulge * 0.7, height * 0.75]
        - [radius, height - 0.02]
        - [radius - rim * 0.4, height]
        - [radius - rim, height - rim]
        - [0, height - rim]
    ops: [{type: jitter, amount: 0.003, seed: 11}]
    shading: auto
    smooth_angle: 35
    anchor: bottom
    position: [0, 0, 0]
    material: oak

  hoop:
    doc: iron bands following the bulge
    shape: {type: ring, radius: radius + bulge * 0.62 + hoop_t, thickness: hoop_t * 2.5, height: hoop_w, segments: sides}
    position: [0, height * 0.2, 0]
    array: {count: 2, offset: [0, height * 0.6, 0]}
    shading: flat
    material: iron

  end_hoop:
    shape: {type: ring, radius: radius + hoop_t * 0.8, thickness: hoop_t * 2.5, height: hoop_w * 0.8, segments: sides}
    anchor: bottom
    position: [0, 0, 0]
    mirror: {axis: y, at: height / 2}
    material: iron

  bung:
    doc: stopper on the belly
    shape: {type: cylinder, radius: 0.028, height: 0.03, segments: 6}
    rotate: [90, 0, 0]
    anchor: back
    position: [0, height * 0.5, radius + bulge - 0.012]
    material: oak

sockets:
  top_center: {attach: {to: body, at: top}, doc: place mugs / candles}

collision: {mode: hull}

checks:
  - {expr: asset.height, min: 0.85, max: 0.95}
  - {expr: asset.width / asset.height, min: 0.6, max: 0.8, doc: stout barrel proportions}
