shapewright: 0.1
profile: mobile_mid
style: stylized_lowpoly
budget:
  triangles: 1200
  materials: 3
params:
  board_t:
    value: 0.045
    doc: plank thickness for shelves, seats, crate walls
  seam:
    value: 0.008
    doc: gap between neighbouring planks
  leg:
    value: 0.08
    doc: section of every leg / post
  leg_taper:
    value: 0.88
    doc: legs narrow toward the top (foot wider)
  rail:
    value: 0.05
    doc: section of rails / stretchers
  band_w:
    value: 0.045
    doc: iron band width
  band_t:
    value: 0.012
    doc: how far an iron band stands proud of what it wraps
  rivet_r:
    value: 0.011
    doc: rivet head radius
  wear:
    value: 0.004
    doc: hand-made jitter
  bench_h:
    value: 0.85
    doc: workbench top; anvil_stump face is ~0.8
  seat_h:
    value: 0.5
    doc: smith stool seat (a bit taller than a tavern stool)
  seat_w:
    value: 0.42
    min: 0.32
    max: 0.5
    doc: seat length along x
  seat_d:
    value: 0.38
    min: 0.3
    max: 0.45
  seat_t:
    value: board_t * 1.2
    doc: seat boards a bit thicker than shelf boards
  splay_in:
    value: 0.04
    doc: legs set in from the seat edge
  frame_w: seat_w - 2 * splay_in
  frame_d: seat_d - 2 * splay_in
materials:
  wood:
    base_color: '#9a6a40'
    roughness: 0.85
    doc: boards, planks, staves
  wood_dark:
    base_color: '#5e3b22'
    roughness: 0.9
    doc: legs, rails, battens, brackets
  iron:
    base_color: '#5a5f66'
    metallic: 0.6
    roughness: 0.55
    doc: bands, rivets, handles (same as anvil_stump)
asset:
  name: smith_stool
  kind: prop/furniture/stool
  description: Square two-plank blacksmith stool with iron-banded legs (blacksmith workstation pack).
  tags:
  - blacksmith_pack
parts:
  seat:
    component: plank_top
    with:
      length: seat_w
      width: seat_d
      thickness: seat_t
      planks: 2
      gap: seam
      wear: wear
      batten_from_end: splay_in + leg / 2 - 0.04
    materials:
      top: wood
      under: wood_dark
    anchor: top
    position:
    - 0
    - seat_h
    - 0
  frame:
    component: leg_frame
    with:
      width: frame_w
      depth: frame_d
      height: seat_h - seat_t + 0.004
      leg: leg
      taper: leg_taper
      rail: rail * 0.9
      rail_y: 0.17
      side_rails: 1
      long_rails: 1
      aprons: 0
      band_w: band_w
      band_t: band_t
      wear: wear
    materials:
      structure: wood_dark
      metal: iron
    anchor: bottom
    position:
    - 0
    - 0
    - 0
  strap:
    doc: iron band tying the two seat planks together
    component: iron_band
    with:
      inner_x: seat_t
      inner_z: seat_d
      band_w: band_w
      band_t: band_t
      rivet_r: rivet_r
      rivets: 1
    materials:
      metal: iron
    rotate:
    - 0
    - 0
    - 90
    anchor: center
    position:
    - 0
    - seat_h - seat_t / 2
    - 0
sockets:
  sit_point:
    attach:
      to: seat
      at: top
collision:
  mode: single_box
checks:
- expr: seat.max.y
  min: seat_h - 0.005
  max: seat_h + 0.01
  doc: pack-wide seat height
- expr: frame.size.x / seat.size.x
  min: 0.7
  max: 0.95
  doc: legs sit under the seat
