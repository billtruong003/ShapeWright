# cozy_house kit module 16: straight roof section (one bay, one slope)
# Origin: ridge plumb line (z = 0) at the height of the deck underside's eave end. Sized for a 2-bay-deep house; other depths set `run` (see README).
shapewright: 0.1
pack: cozy_house
asset:
  name: house_roof_section
  kind: environment/modular/roof
  description: One bay of shingled roof slope with fascia and rafter tails (cozy_house kit).
  tags: [cozy_house, module, roof]
  placement: free
export: {merge: by_material}
collision: {mode: single_hull}

params:
  deep: {value: 2, min: 1, max: 4, doc: house depth in bays (the slope runs from the ridge over half of it)}

parts:
  slope:
    component: house_roof
    with: {length: bay, run: deep * bay / 2 + wall_t / 2 + eave, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave}
    materials: {roof: roof, timber: timber}
    origin: keep
    position: [0, 0, 0]
