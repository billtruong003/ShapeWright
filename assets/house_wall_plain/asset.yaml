shapewright: 0.1
pack: cozy_house
asset:
  name: house_wall_plain
  kind: environment/modular/wall
  description: Half-timbered plain wall bay with an X brace (cozy_house kit).
  tags: [cozy_house, module, wall]
  placement: floor
