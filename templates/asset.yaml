# Shapewright asset source. Units: metres. +Y up, asset front faces +Z, right is +X.
# Reference: docs/ASSET_FORMAT.md   Vocabulary: `sw caps`   Loop: AGENTS.md
shapewright: 0.1
asset:
  name: NAME
  kind: prop                      # e.g. prop/furniture/chair
  description: One sentence describing the asset and its purpose.
profile: mobile_mid               # production budgets (profiles/*.yaml)
style: stylized_lowpoly           # art direction (styles/*.yaml)
budget: {triangles: 800}          # overrides the profile

params:                           # every meaningful dimension gets a name
  width: {value: 0.5, min: 0.2, max: 1.0, doc: overall width}
  height: 0.8
  thickness: 0.05

materials:
  main: {base_color: "#8a5a36", roughness: 0.85}

parts:
  body:
    doc: main body
    shape: {type: chamfer_box, size: [width, height, width], chamfer: 0.01}
    position: [0, 0, 0]           # where this part's anchor goes
    anchor: bottom                # rest the part's bottom on the ground
    material: main

checks:                           # design intent as tests (sw validate)
  - {expr: asset.height, min: 0.7, max: 0.9, doc: overall height}
