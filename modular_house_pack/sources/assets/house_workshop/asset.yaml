# Demo house C (cozy_house kit): an asymmetric workshop-tavern. A two-storey main block (3 x 2 bays,
# tavern door, ridge along x) with a one-storey workshop wing (2 x 2 bays, shopfront + wide door)
# attached on its right. The wing's roof butts into the main block's side wall, and the wing has NO
# posts, footing or wall on the shared grid line (the main block's are there): nothing is doubled.
#
# Plan (x): main block A0..A1, wing A1..A2; both span z in [-D/2, D/2].
shapewright: 0.1
pack: cozy_house
asset:
  name: house_workshop
  kind: environment/building/house
  description: Asymmetric two-storey tavern with a one-storey workshop wing, assembled from the cozy_house kit.
  tags: [cozy_house, demo_house]
  placement: floor
budget: {triangles: 60000, materials: 7, texture_size: 2048, draw_calls: 7}
uv: {texel_density: 30}
export: {merge: by_material}
collision: {mode: single_hull}

params:
  nm: {value: 3, doc: main block bays along x}
  nw: {value: 2, doc: wing bays along x}
  nz: {value: 2, doc: bays along z (both blocks)}
  A0: -(nm + nw) * bay / 2
  A1: A0 + nm * bay
  A2: A1 + nw * bay
  D:  nz * bay
  z0: -D / 2
  y0: base_h - sink
  y1: lv1 - sink
  ytm: lv2 - sink                        # main roof bearing
  ytw: lv1 - sink                        # wing roof bearing
  run: D / 2 + wall_t / 2 + eave
  dt: roof_t / cos(pitch)
  yrm: ytm - eave * tan(pitch)
  yrw: ytw - eave * tan(pitch)
  ridge_m: yrm + run * tan(pitch) + dt + shingle_t * 0.35
  ridge_w: yrw + run * tan(pitch) + dt + shingle_t * 0.35
  verge_len: verge + wall_t / 2
  band_off: wall_t / 4

parts:
  # ================================================================ footings (main: full ring; wing: 3 sides)
  footing_m_fb:
    component: house_footing
    with: {length: bay - footing_d, height: y0, depth: footing_d, blocks: 3}
    materials: {stone: stone}
    origin: keep
    position: [A0 + bay / 2, 0, D / 2]
    array: [{count: nm + nw, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]
  footing_sides:
    doc: main left side, main right side (shared with the wing), wing right side
    component: house_footing
    with: {length: bay - footing_d, height: y0, depth: footing_d, blocks: 3}
    materials: {stone: stone}
    origin: keep
    rotate: [0, 90, 0]
    position: [A0, 0, z0 + bay / 2]
    array: [{count: nz, offset: [0, 0, bay]}, {count: 3, offset: [nm * bay, 0, 0], each: {translate: ["-(nm - nw) * bay * (i == 2)", 0, 0]}}]
  node_stone_fb:
    component: house_footing
    with: {length: footing_d, height: y0, depth: footing_d, blocks: 1}
    materials: {stone: stone}
    origin: keep
    position: [A0, 0, D / 2]
    array: [{count: nm + nw + 1, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]
  node_stone_mid:
    component: house_footing
    with: {length: footing_d, height: y0, depth: footing_d, blocks: 1}
    materials: {stone: stone}
    origin: keep
    position: [A0, 0, 0]
    array: {count: 3, offset: [nm * bay, 0, 0], each: {translate: ["-(nm - nw) * bay * (i == 2)", 0, 0]}}

  # ================================================================ decks
  deck_ground:
    component: house_floor
    with: {w: bay, d: bay, t: floor_t}
    materials: {planks: planks, timber: timber}
    origin: keep
    position: [A0 + bay / 2, base_h, z0 + bay / 2]
    array: [{count: nm + nw, offset: [bay, 0, 0]}, {count: nz, offset: [0, 0, bay]}]
  deck_upper:
    component: house_floor
    with: {w: bay, d: bay, t: floor_t}
    materials: {planks: planks, timber: timber}
    origin: keep
    position: [A0 + bay / 2, lv1, z0 + bay / 2]
    array: [{count: nm, offset: [bay, 0, 0]}, {count: nz, offset: [0, 0, bay]}]

  # ================================================================ posts
  post_main_fb:
    doc: main block, both storeys, front and back rows (includes the shared line x = A1)
    component: house_timber
    with: {length: storey, w: post, d: post, chamfer: chamfer, wear: wear}
    materials: {timber: timber}
    origin: keep
    position: [A0, y0, D / 2]
    array: [{count: nm + 1, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}, {count: 2, offset: [0, storey, 0]}]
  post_main_mid:
    component: house_timber
    with: {length: storey, w: post, d: post, chamfer: chamfer, wear: wear}
    materials: {timber: timber}
    origin: keep
    position: [A0, y0, 0]
    array: [{count: 2, offset: [nm * bay, 0, 0]}, {count: 2, offset: [0, storey, 0]}]
  post_wing:
    doc: wing, one storey; its nodes on x = A1 are the main block's posts
    component: house_timber
    with: {length: storey, w: post, d: post, chamfer: chamfer, wear: wear}
    materials: {timber: timber}
    origin: keep
    position: [A1 + bay, y0, D / 2]
    array: [{count: nw, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]
  post_wing_mid:
    component: house_timber
    with: {length: storey, w: post, d: post, chamfer: chamfer, wear: wear}
    materials: {timber: timber}
    origin: keep
    position: [A2, y0, 0]

  # ================================================================ bands
  floor_band_m_fb:
    component: house_timber
    with: {length: bay - post, w: band_h, d: wall_t / 2, chamfer: chamfer, wear: wear, seed: 5}
    materials: {timber: timber}
    origin: keep
    rotate: [0, 0, 90]
    position: [A0 + post / 2 + (bay - post), lv1 - floor_t + band_h / 2, D / 2 + band_off]
    array: [{count: nm, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D - 2 * band_off]}]
  floor_band_m_left:
    component: house_timber
    with: {length: bay - post, w: wall_t / 2, d: band_h, chamfer: chamfer, wear: wear, seed: 6}
    materials: {timber: timber}
    origin: keep
    rotate: [90, 0, 0]
    position: [A0 - band_off, lv1 - floor_t + band_h / 2, z0 + post / 2]
    array: {count: nz, offset: [0, 0, bay]}
  floor_band_m_right:
    doc: on the shared line the wing's top band carries the wing roof; the main block's floor band sits inside it (inner half)
    component: house_timber
    with: {length: bay - post, w: wall_t / 2, d: band_h, chamfer: chamfer, wear: wear, seed: 7}
    materials: {timber: timber}
    origin: keep
    rotate: [90, 0, 0]
    position: [A1 - band_off, lv1 - floor_t + band_h / 2, z0 + post / 2]
    array: {count: nz, offset: [0, 0, bay]}
  top_band_m_fb:
    component: house_timber
    with: {length: bay - post, w: band_h, d: wall_t, chamfer: chamfer, wear: wear, seed: 8}
    materials: {timber: timber}
    origin: keep
    rotate: [0, 0, 90]
    position: [A0 + post / 2 + (bay - post), ytm - band_h / 2, D / 2]
    array: [{count: nm, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]
  top_band_m_side:
    component: house_timber
    with: {length: bay - post, w: wall_t, d: band_h, chamfer: chamfer, wear: wear, seed: 9}
    materials: {timber: timber}
    origin: keep
    rotate: [90, 0, 0]
    position: [A0, ytm - band_h / 2, z0 + post / 2]
    array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [nm * bay, 0, 0]}]
  top_band_w_fb:
    component: house_timber
    with: {length: bay - post, w: band_h, d: wall_t, chamfer: chamfer, wear: wear, seed: 10}
    materials: {timber: timber}
    origin: keep
    rotate: [0, 0, 90]
    position: [A1 + post / 2 + (bay - post), ytw - band_h / 2, D / 2]
    array: [{count: nw, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]
  top_band_w_side:
    doc: the wing's outer end only (its other end is the main block's wall line)
    component: house_timber
    with: {length: bay - post, w: wall_t, d: band_h, chamfer: chamfer, wear: wear, seed: 11}
    materials: {timber: timber}
    origin: keep
    rotate: [90, 0, 0]
    position: [A2, ytw - band_h / 2, z0 + post / 2]
    array: {count: nz, offset: [0, 0, bay]}

  # ================================================================ main block: ground floor
  m_front_window:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: win_w, op_h: win_h, op_sill: win_sill + sink, seed: 1}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [A0 + bay / 2, y0, D / 2]
    array: {count: 2, offset: [2 * bay, 0, 0]}
  m_front_window_frame:
    component: house_window_frame
    with: {w: win_w, h: win_h, depth: wall_t, frame: frame}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [A0 + bay / 2, base_h + win_sill, D / 2]
    array: {count: 2, offset: [2 * bay, 0, 0]}
  m_front_door:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 2, op_w: door_w, op_h: door_h + sink, seed: 2}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [A0 + 1.5 * bay, y0, D / 2]
  m_door_frame:
    component: house_door_frame
    with: {w: door_w, h: door_h + sink - timber, depth: wall_t, frame: door_frame}
    materials: {timber: timber}
    origin: keep
    position: [A0 + 1.5 * bay, y0 + timber, D / 2]
  m_door:
    component: house_door
    with: {w: door_w - 2 * door_frame - 0.012, h: door_h + sink - timber - door_frame * 1.3 - 0.008}
    materials: {planks: planks, timber: timber, iron: iron}
    origin: keep
    position: [A0 + 1.5 * bay, y0 + timber + 0.004, D / 2 - 0.03]
  m_back:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear, opening: 0, seed: 3}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 180, 0]
    position: [A0 + bay / 2, y0, -D / 2]
    array: {count: nm, offset: [bay, 0, 0]}
  m_left:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear, opening: 0, seed: 4}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, -90, 0]
    position: [A0, y0, z0 + bay / 2]
    array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [0, storey, 0]}]
  m_right_inner:
    doc: ground floor on the shared line is an inner wall between the tavern and the workshop (with a door)
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 2, op_w: door_w, op_h: door_h + sink, seed: 5}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 90, 0]
    position: [A1, y0, z0 + bay / 2]
  m_right_inner_plain:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear, opening: 0, seed: 6}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 90, 0]
    position: [A1, y0, z0 + 1.5 * bay]

  # ================================================================ main block: upper floor
  m_upper_front:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: win_w * 0.7, op_h: win_h * 0.9, op_sill: win_sill + sink + 0.1, braces: 1, seed: 11}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [A0 + bay / 2, y1, D / 2]
    array: {count: nm, offset: [bay, 0, 0]}
  m_upper_front_window:
    component: house_window_frame
    with: {w: win_w * 0.7, h: win_h * 0.9, depth: wall_t, frame: frame}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [A0 + bay / 2, lv1 + win_sill + 0.1, D / 2]
    array: {count: nm, offset: [bay, 0, 0]}
  m_upper_back:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: win_w, op_h: win_h, op_sill: win_sill + sink, seed: 12}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 180, 0]
    position: [A0 + bay / 2, y1, -D / 2]
    array: {count: nm, offset: [bay, 0, 0]}
  m_upper_back_window:
    component: house_window_frame
    with: {w: win_w, h: win_h, depth: wall_t, frame: frame}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [A0 + bay / 2, lv1 + win_sill, -D / 2]
    array: {count: nm, offset: [bay, 0, 0]}
  m_upper_right:
    doc: above the wing roof (mostly hidden by it; plain)
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear, opening: 0, seed: 13}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 90, 0]
    position: [A1, y1, z0 + bay / 2]
    array: {count: nz, offset: [0, 0, bay]}

  # ================================================================ wing (workshop)
  w_front_shop:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: shop_w, op_h: shop_h, op_sill: shop_sill + sink, braces: 0, seed: 21}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [A1 + bay / 2, y0, D / 2]
  w_shop_frame:
    component: house_window_frame
    with: {w: shop_w, h: shop_h, depth: wall_t, frame: frame, mullion: 0, glazed: 0, sill_out: 0.16}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [A1 + bay / 2, base_h + shop_sill, D / 2]
  w_awning:
    component: house_roof
    with: {length: shop_w + 2 * frame + 0.2, run: 0.62, pitch: 25, t: roof_t * 0.7, st: shingle_t, course: course * 0.8, tile: tile_w, eave: 0.3, rafters: 0, barge_l: 1, barge_r: 1}
    materials: {roof: roof, timber: timber}
    origin: keep
    position: [A1 + bay / 2, base_h + shop_sill + shop_h + 0.08, D / 2 + wall_t / 2 - 0.027]   # 1.5 cm into the stud face (studs sit 12 mm behind the plates; hand-derived)
  w_front_door:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 2, op_w: door_w, op_h: door_h + sink, seed: 22}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [A1 + 1.5 * bay, y0, D / 2]
  w_door_frame:
    component: house_door_frame
    with: {w: door_w, h: door_h + sink - timber, depth: wall_t, frame: door_frame}
    materials: {timber: timber}
    origin: keep
    position: [A1 + 1.5 * bay, y0 + timber, D / 2]
  w_door:
    component: house_door
    with: {w: door_w - 2 * door_frame - 0.012, h: door_h + sink - timber - door_frame * 1.3 - 0.008}
    materials: {planks: planks, timber: timber, iron: iron}
    origin: keep
    position: [A1 + 1.5 * bay, y0 + timber + 0.004, D / 2 - 0.03]
  w_back:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: win_w, op_h: win_h, op_sill: win_sill + sink, seed: 23}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 180, 0]
    position: [A1 + bay / 2, y0, -D / 2]
    array: {count: nw, offset: [bay, 0, 0]}
  w_back_window:
    component: house_window_frame
    with: {w: win_w, h: win_h, depth: wall_t, frame: frame}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [A1 + bay / 2, base_h + win_sill, -D / 2]
    array: {count: nw, offset: [bay, 0, 0]}
  w_right:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear, opening: 0, seed: 24}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 90, 0]
    position: [A2, y0, z0 + bay / 2]
    array: {count: nz, offset: [0, 0, bay]}

  # ================================================================ roofs
  roof_m_front:
    component: house_roof
    with: {length: bay, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave}
    materials: {roof: roof, timber: timber}
    origin: keep
    position: [A0 + bay / 2, yrm, 0]
    array: {count: nm, offset: [bay, 0, 0]}
  roof_m_back:
    component: house_roof
    with: {length: bay, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, 180, 0]
    position: [A0 + bay / 2, yrm, 0]
    array: {count: nm, offset: [bay, 0, 0]}
  verge_m_left:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_l: 1, align: 1}
    materials: {roof: roof, timber: timber}
    origin: keep
    position: [A0 - verge_len / 2, yrm, 0]
  verge_m_left_back:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_r: 1, align: -1}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, 180, 0]
    position: [A0 - verge_len / 2, yrm, 0]
  verge_m_right:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_r: 1, align: -1}
    materials: {roof: roof, timber: timber}
    origin: keep
    position: [A1 + verge_len / 2, yrm, 0]
  verge_m_right_back:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_l: 1, align: 1}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, 180, 0]
    position: [A1 + verge_len / 2, yrm, 0]
  gable_m:
    component: house_gable
    with: {span: D + wall_t, pitch: pitch, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [A0, ytm, 0]
    array: {count: 2, offset: [nm * bay, 0, 0]}
  ridge_m:
    component: house_ridge
    with: {length: nm * bay + 2 * verge_len}
    materials: {roof: roof}
    origin: keep
    position: [(A0 + A1) / 2, ridge_m - 0.03, 0]

  roof_w_front:
    doc: the wing roof starts on the shared grid line; its first half wall-depth runs into the main block's wall (hidden)
    component: house_roof
    with: {length: bay, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave}
    materials: {roof: roof, timber: timber}
    origin: keep
    position: [A1 + bay / 2, yrw, 0]
    array: {count: nw, offset: [bay, 0, 0]}
  roof_w_back:
    component: house_roof
    with: {length: bay, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, 180, 0]
    position: [A1 + bay / 2, yrw, 0]
    array: {count: nw, offset: [bay, 0, 0]}
  verge_w:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_r: 1, align: -1}
    materials: {roof: roof, timber: timber}
    origin: keep
    position: [A2 + verge_len / 2, yrw, 0]
  verge_w_back:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_l: 1, align: 1}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, 180, 0]
    position: [A2 + verge_len / 2, yrw, 0]
  gable_w:
    component: house_gable
    with: {span: D + wall_t, pitch: pitch, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [A2, ytw, 0]
  ridge_w:
    component: house_ridge
    with: {length: nw * bay + verge_len}
    materials: {roof: roof}
    origin: keep
    position: [A1 + (nw * bay + verge_len) / 2, ridge_w - 0.03, 0]

  # ================================================================ extras
  chimney:
    component: house_chimney
    with: {height: ridge_m + 0.7, shoulder: y1 - 0.3}
    materials: {stone: stone, roof: roof}
    origin: keep
    rotate: [0, 90, 0]
    position: [A0 - wall_t / 2 - 0.35, 0, 0]
  steps_m:
    component: house_steps
    with: {width: door_w + 0.5, rise: base_h - 0.004, steps: 2, tread: 0.34}
    materials: {stone: stone}
    origin: keep
    position: [A0 + 1.5 * bay, 0, D / 2 + footing_d / 2]
  steps_w:
