# Demo house B (cozy_house kit): a narrow two-storey townhouse, 2 bays wide x 3 deep, gable to the
# street (ridge along z). Ground floor: shopfront + door; upper floor: upper-wall bays; a floor band
# beam between the storeys; chimney on the right side. Same kit as the cottage; nothing unique.
#
# Orientation rule for wall modules (their outer face is local +z):
#   front z = +D/2: rotate 0 | back z = -D/2: rotate 180 | right x = +W/2: rotate 90 | left x = -W/2: rotate -90
shapewright: 0.1
pack: cozy_house
asset:
  name: house_townhouse
  kind: environment/building/house
  description: Narrow two-storey half-timbered townhouse with a ground-floor shop, assembled from the cozy_house kit.
  tags: [cozy_house, demo_house]
  placement: floor
budget: {triangles: 45000, materials: 7, texture_size: 2048, draw_calls: 7}
uv: {texel_density: 40}
export: {merge: by_material}
collision: {mode: single_box}

params:
  nx: {value: 2, doc: bays along x (street frontage)}
  nz: {value: 3, doc: bays along z (depth; ridge direction)}
  W:  nx * bay
  D:  nz * bay
  x0: -W / 2
  z0: -D / 2
  y0: base_h - sink                     # ground storey walls/posts start
  y1: lv1 - sink                        # upper storey walls/posts start
  y_top: lv2 - sink                     # top of upper posts and top band = roof bearing
  run: W / 2 + wall_t / 2 + eave
  dt: roof_t / cos(pitch)
  y_roof: y_top - eave * tan(pitch)
  ridge_y: y_roof + run * tan(pitch) + dt + shingle_t * 0.35
  verge_len: verge + wall_t / 2
  band_off: wall_t / 4                  # the floor band fills the OUTER half of the wall line

parts:
  # ---------------------------------------------------------------- footing (same recipe as the cottage)
  footing_fb:
    component: house_footing
    with: {length: bay - footing_d, height: y0, depth: footing_d, blocks: 3}
    materials: {stone: stone}
    origin: keep
    position: [x0 + bay / 2, 0, D / 2]
    array: [{count: nx, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]
  footing_side:
    component: house_footing
    with: {length: bay - footing_d, height: y0, depth: footing_d, blocks: 3}
    materials: {stone: stone}
    origin: keep
    rotate: [0, 90, 0]
    position: [x0, 0, z0 + bay / 2]
    array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]
  node_stone:
    component: house_footing
    with: {length: footing_d, height: y0, depth: footing_d, blocks: 1}
    materials: {stone: stone}
    origin: keep
    position: [x0, 0, D / 2]
    array: [{count: nx + 1, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]
  node_stone_side:
    component: house_footing
    with: {length: footing_d, height: y0, depth: footing_d, blocks: 1}
    materials: {stone: stone}
    origin: keep
    position: [x0, 0, z0 + bay]
    array: [{count: nz - 1, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]

  # ---------------------------------------------------------------- decks
  deck_ground:
    component: house_floor
    with: {w: bay, d: bay, t: floor_t}
    materials: {planks: planks, timber: timber}
    origin: keep
    position: [x0 + bay / 2, base_h, z0 + bay / 2]
    array: [{count: nx, offset: [bay, 0, 0]}, {count: nz, offset: [0, 0, bay]}]
  deck_upper:
    component: house_floor
    with: {w: bay, d: bay, t: floor_t}
    materials: {planks: planks, timber: timber}
    origin: keep
    position: [x0 + bay / 2, lv1, z0 + bay / 2]
    array: [{count: nx, offset: [bay, 0, 0]}, {count: nz, offset: [0, 0, bay]}]

  # ---------------------------------------------------------------- posts: two storeys stacked on every perimeter node
  post_fb:
    component: house_timber
    with: {length: storey, w: post, d: post, chamfer: chamfer, wear: wear}
    materials: {timber: timber}
    origin: keep
    position: [x0, y0, D / 2]
    array: [{count: nx + 1, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}, {count: 2, offset: [0, storey, 0]}]
  post_side:
    component: house_timber
    with: {length: storey, w: post, d: post, chamfer: chamfer, wear: wear}
    materials: {timber: timber}
    origin: keep
    position: [x0, y0, z0 + bay]
    array: [{count: nz - 1, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}, {count: 2, offset: [0, storey, 0]}]

  # ---------------------------------------------------------------- band beams
  floor_band_front:
    doc: floor band between the storeys, outer half of the wall line (the upper deck fills the inner half)
    component: house_timber
    with: {length: bay - post, w: band_h, d: wall_t / 2, chamfer: chamfer, wear: wear, seed: 5}
    materials: {timber: timber}
    origin: keep
    rotate: [0, 0, 90]
    position: [x0 + post / 2 + (bay - post), lv1 - floor_t + band_h / 2, D / 2 + band_off]
    array: {count: nx, offset: [bay, 0, 0]}
  floor_band_back:
    component: house_timber
    with: {length: bay - post, w: band_h, d: wall_t / 2, chamfer: chamfer, wear: wear, seed: 6}
    materials: {timber: timber}
    origin: keep
    rotate: [0, 0, 90]
    position: [x0 + post / 2 + (bay - post), lv1 - floor_t + band_h / 2, -D / 2 - band_off]
    array: {count: nx, offset: [bay, 0, 0]}
  floor_band_side:
    component: house_timber
    with: {length: bay - post, w: wall_t / 2, d: band_h, chamfer: chamfer, wear: wear, seed: 7}
    materials: {timber: timber}
    origin: keep
    rotate: [90, 0, 0]
    position: [x0 - band_off, lv1 - floor_t + band_h / 2, z0 + post / 2]
    array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W + 2 * band_off, 0, 0]}]
  top_band_fb:
    component: house_timber
    with: {length: bay - post, w: band_h, d: wall_t, chamfer: chamfer, wear: wear, seed: 8}
    materials: {timber: timber}
    origin: keep
    rotate: [0, 0, 90]
    position: [x0 + post / 2 + (bay - post), y_top - band_h / 2, D / 2]
    array: [{count: nx, offset: [bay, 0, 0]}, {count: 2, offset: [0, 0, -D]}]
  top_band_side:
    component: house_timber
    with: {length: bay - post, w: wall_t, d: band_h, chamfer: chamfer, wear: wear, seed: 9}
    materials: {timber: timber}
    origin: keep
    rotate: [90, 0, 0]
    position: [x0, y_top - band_h / 2, z0 + post / 2]
    array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]

  # ---------------------------------------------------------------- ground floor walls
  shop_wall:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: shop_w, op_h: shop_h, op_sill: shop_sill + sink, braces: 0, seed: 1}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [x0 + bay / 2, y0, D / 2]
  shop_frame:
    component: house_window_frame
    with: {w: shop_w, h: shop_h, depth: wall_t, frame: frame, mullion: 0, glazed: 0, sill_out: 0.16}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [x0 + bay / 2, base_h + shop_sill, D / 2]
  shop_awning:
    component: house_roof
    with: {length: shop_w + 2 * frame + 0.2, run: 0.62, pitch: 25, t: roof_t * 0.7, st: shingle_t, course: course * 0.8, tile: tile_w, eave: 0.3, rafters: 0, barge_l: 1, barge_r: 1}
    materials: {roof: roof, timber: timber}
    origin: keep
    position: [x0 + bay / 2, base_h + shop_sill + shop_h + 0.08, D / 2 + wall_t / 2 - 0.027]   # 1.5 cm into the stud face (studs sit 12 mm behind the plates; hand-derived)
  door_wall:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 2, op_w: door_w, op_h: door_h + sink, seed: 2}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [x0 + 1.5 * bay, y0, D / 2]
  door_frame:
    component: house_door_frame
    with: {w: door_w, h: door_h + sink - timber, depth: wall_t, frame: door_frame}
    materials: {timber: timber}
    origin: keep
    position: [x0 + 1.5 * bay, y0 + timber, D / 2]
  door:
    component: house_door
    with: {w: door_w - 2 * door_frame - 0.012, h: door_h + sink - timber - door_frame * 1.3 - 0.008}
    materials: {planks: planks, timber: timber, iron: iron}
    origin: keep
    position: [x0 + 1.5 * bay, y0 + timber + 0.004, D / 2 - 0.03]
  ground_back:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: win_w, op_h: win_h, op_sill: win_sill + sink, seed: 3}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 180, 0]
    position: [x0 + bay / 2, y0, -D / 2]
    array: {count: nx, offset: [bay, 0, 0]}
  ground_back_window:
    component: house_window_frame
    with: {w: win_w, h: win_h, depth: wall_t, frame: frame}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [x0 + bay / 2, base_h + win_sill, -D / 2]
    array: {count: nx, offset: [bay, 0, 0]}
  ground_side:
    doc: side walls on both sides; the middle bay of each has a window
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear, opening: 0, seed: 4}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 90, 0]
    position: [x0, y0, z0 + bay / 2]
    array: [{count: nz, offset: [0, 0, bay], skip: [1]}, {count: 2, offset: [W, 0, 0]}]
  ground_side_window:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: win_w, op_h: win_h, op_sill: win_sill + sink, seed: 5}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 90, 0]
    position: [x0, y0, 0]
    array: {count: 2, offset: [W, 0, 0]}
  ground_side_frame:
    component: house_window_frame
    with: {w: win_w, h: win_h, depth: wall_t, frame: frame}
    materials: {timber: timber, glass: glass}
    origin: keep
    rotate: [0, 90, 0]
    position: [x0, base_h + win_sill, 0]
    array: {count: 2, offset: [W, 0, 0]}

  # ---------------------------------------------------------------- upper floor walls
  upper_front:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: win_w * 0.7, op_h: win_h * 0.9, op_sill: win_sill + sink + 0.1, braces: 1, seed: 11}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [x0 + bay / 2, y1, D / 2]
    array: {count: nx, offset: [bay, 0, 0]}
  upper_front_window:
    component: house_window_frame
    with: {w: win_w * 0.7, h: win_h * 0.9, depth: wall_t, frame: frame}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [x0 + bay / 2, lv1 + win_sill + 0.1, D / 2]
    array: {count: nx, offset: [bay, 0, 0]}
  upper_back:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear, opening: 0, seed: 12}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 180, 0]
    position: [x0 + bay / 2, y1, -D / 2]
    array: {count: nx, offset: [bay, 0, 0]}
  upper_side:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: win_w * 0.7, op_h: win_h * 0.9, op_sill: win_sill + sink + 0.1, braces: 1, seed: 13}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 90, 0]
    position: [x0, y1, z0 + bay / 2]
    array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]
  upper_side_window:
    component: house_window_frame
    with: {w: win_w * 0.7, h: win_h * 0.9, depth: wall_t, frame: frame}
    materials: {timber: timber, glass: glass}
    origin: keep
    rotate: [0, 90, 0]
    position: [x0, lv1 + win_sill + 0.1, z0 + bay / 2]
    array: [{count: nz, offset: [0, 0, bay]}, {count: 2, offset: [W, 0, 0]}]

  # ---------------------------------------------------------------- roof: ridge along z, gables to the street and the yard
  roof_right:
    component: house_roof
    with: {length: bay, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, 90, 0]
    position: [0, y_roof, z0 + bay / 2]
    array: {count: nz, offset: [0, 0, bay]}
  roof_left:
    component: house_roof
    with: {length: bay, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, -90, 0]
    position: [0, y_roof, z0 + bay / 2]
    array: {count: nz, offset: [0, 0, bay]}
  verge_front_right:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_l: 1, align: 1}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, 90, 0]
    position: [0, y_roof, D / 2 + verge_len / 2]
  verge_front_left:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_r: 1, align: -1}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, -90, 0]
    position: [0, y_roof, D / 2 + verge_len / 2]
  verge_back_right:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_r: 1, align: -1}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, 90, 0]
    position: [0, y_roof, -D / 2 - verge_len / 2]
  verge_back_left:
    component: house_roof
    with: {length: verge_len, run: run, pitch: pitch, t: roof_t, st: shingle_t, course: course, tile: tile_w, eave: eave, rafters: 0, barge_l: 1, align: 1}
    materials: {roof: roof, timber: timber}
    origin: keep
    rotate: [0, -90, 0]
    position: [0, y_roof, -D / 2 - verge_len / 2]
  gable:
    component: house_gable
    with: {span: W + wall_t, pitch: pitch, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    rotate: [0, 90, 0]
    position: [0, y_top, z0]
    array: {count: 2, offset: [0, 0, D]}
  ridge:
    component: house_ridge
    with: {length: D + 2 * verge_len}
    materials: {roof: roof}
    origin: keep
    rotate: [0, 90, 0]
    position: [0, ridge_y - 0.03, 0]

  # ---------------------------------------------------------------- extras
  chimney:
    doc: outside the right side wall at the back bay; passes the eave and clears the ridge
    component: house_chimney
    with: {height: ridge_y + 0.6, shoulder: y1 - 0.3}
    materials: {stone: stone, roof: roof}
    origin: keep
    rotate: [0, -90, 0]
    position: [W / 2 + wall_t / 2 + 0.35, 0, z0 + bay / 2]
  steps:
    component: house_steps
    with: {width: door_w + 0.5, rise: base_h - 0.004, steps: 2, tread: 0.34}
    materials: {stone: stone}
    origin: keep
    position: [x0 + 1.5 * bay, 0, D / 2 + footing_d / 2]

sockets:
  entrance: {attach: {to: origin, offset: [x0 + 1.5 * bay, base_h, D / 2 + 0.6]}, doc: in front of the door}
  shop_counter: {attach: {to: origin, offset: [x0 + bay / 2, base_h + shop_sill, D / 2 + 0.3]}, doc: customers stand here}
