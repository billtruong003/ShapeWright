# cozy_house kit module 5: wall bay with a shopfront
# Wide opening over a counter board; a small shingled awning (the roof component again) above it.
shapewright: 0.1
pack: cozy_house
asset:
  name: house_wall_shopfront
  kind: environment/modular/wall
  description: Half-timbered wall bay with a shop counter opening and awning (cozy_house kit).
  tags: [cozy_house, module, wall]
  placement: floor
export: {merge: by_material}
collision: {mode: single_box}

params:
  seed: {value: 0, doc: jitter seed offset}

parts:
  wall:
    component: house_wall
    with: {span: bay - post, height: panel_h, depth: wall_t, plaster: plaster_t, timber: timber, chamfer: chamfer, wear: wear,
           opening: 1, op_w: shop_w, op_h: shop_h, op_sill: shop_sill + sink, braces: 0, seed: seed}
    materials: {timber: timber, plaster: plaster}
    origin: keep
    position: [0, 0, 0]
  window:
    component: house_window_frame
    with: {w: shop_w, h: shop_h, depth: wall_t, frame: frame, mullion: 0, glazed: 0, sill_out: 0.16}
    materials: {timber: timber, glass: glass}
    origin: keep
    position: [0, shop_sill + sink, 0]
  awning:
    doc: small shingled awning over the opening (house_roof reused at a low pitch, no rafter tails)
    component: house_roof
    with: {length: shop_w + 2 * frame + 0.2, run: 0.62, pitch: 25, t: roof_t * 0.7, st: shingle_t, course: course * 0.8, tile: tile_w, eave: 0.3, rafters: 0, barge_l: 1, barge_r: 1}
    materials: {roof: roof, timber: timber}
    origin: keep
    measure:
      stud: {bounds: wall_stud_0}
    position: [0, shop_sill + sink + shop_h + 0.08, stud.max.z - 0.015]   # 1.5 cm into the measured stud face
