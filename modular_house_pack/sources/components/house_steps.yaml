# Stone entrance steps (cozy_house kit): `steps` chunky blocks climbing to a deck height, each
# block sitting on the one below. Front = +z; back face at z = 0 against the footing.
shapewright: 0.1
component: house_steps
doc: Stacked dressed-stone steps. Material `stone`.

params:
  width:  {value: 1.3}
  rise:   {value: 0.5, doc: total height to climb}
  steps:  {value: 2, min: 1, max: 8}
  tread:  {value: 0.34}
  wear:   {value: 0.012}

private:
  sh: rise / steps

parts:
  step:
    shape: {type: chamfer_box, size: [width, sh, tread], chamfer: 0.03}
    ops: [{type: jitter, amount: wear, seed: 97}]
    anchor: bottom_back
    position: [0, 0, 0]
    array: {count: steps, offset: [0, sh, 0], each: {scale: [1, 1, "steps - i"], translate: [0, 0, 0]}}
    material: stone
