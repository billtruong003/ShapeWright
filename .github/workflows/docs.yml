name: docs
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt "mkdocs>=1.6,<2" "mkdocs-material>=9.5"
      - run: python -m pytest -q tests/test_site_docs.py      # every `# run` block in the tutorials still works
      - run: python tools/site/build_site.py --build             # reference + gallery, then mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with: {path: .build/site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
