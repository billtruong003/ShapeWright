name: ci
on:
  push: {branches: [main, "phase/**", "release/**"]}
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff
      - run: ruff check .
  test:
    # golden geometry: exact hashes are compared on the platform that recorded them, the tolerant signature on
    # every platform (tests/golden.py). Supported: Linux and Windows. macOS is not tested (no hardware to debug
    # its hull triangulation; see docs/phases/PHASE_20a.md)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt "mcp>=1.10"
      - run: python -m pytest -q
      - if: runner.os == 'Windows'
        shell: cmd
        run: sw.cmd doctor
      # this OS's exact golden hashes, for `python tests/update_golden.py --merge` (tests/golden.py)
      - if: always()
        run: python tests/update_golden.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "golden-${{ matrix.os }}", path: tests/golden.json}
  godot:
    # release smoke test (track E4): the example exports import into a real engine (Godot 4.3, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        id: godot
        with: {path: ~/godot, key: godot-4.3-stable-linux}
      - if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSLf -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip && rm godot.zip
      - run: SW_GODOT="$HOME/godot/Godot_v4.3-stable_linux.x86_64" python -m pytest -q tests/test_production.py -k godot
