# Stylized low-poly wooden rowing boat for a lakeside level: a flat-bottomed,
# painted hull (lathe bowl stretched along z, narrowed toward the bow, cut square
# at the stern into a transom and hollowed out; the cut faces are bare wood),
# three thwarts, and two oars resting on the thwarts inside. Bow faces +z.
shapewright: 0.1
asset:
  name: rowing_boat
  kind: prop/vehicle/boat
  description: Small painted wooden rowing boat with three thwarts and two oars resting inside, for a stylized mobile lakeside level.
  tags: [wood, boat, lake, vehicle]
profile: mobile_mid
style: stylized_lowpoly
budget: {triangles: 1000}

params:
  half_beam:  {value: 0.62, min: 0.45, max: 0.8, doc: half the widest beam before the bow taper}
  half_len:   {value: 1.5, min: 1.1, max: 1.9, doc: half the hull length before the stern cut}
  depth:      {value: 0.48, min: 0.35, max: 0.6, doc: hull depth from bottom to gunwale}
  wall:       {value: 0.04, doc: hull plank thickness}
  stern_cut:  {value: 0.32, doc: how much of the rounded stern is cut off to make the transom}
  bow_narrow: {value: 0.5, doc: x scale of the hull at the bow end (taper)}
  hull_seg:   {value: 16, doc: facets around the hull}
  thwart_t:   {value: 0.045, doc: seat plank thickness}
  thwart_d:   {value: 0.22, doc: seat plank depth along z}
  seat_y:     {value: depth - 0.13, doc: top of the thwarts}
  oar_len:    {value: 2.0, doc: overall oar length}
  oar_r:      {value: 0.022, doc: oar loom radius}
  blade_l:    {value: 0.5}
  blade_w:    {value: 0.14}
  blade_t:    {value: 0.024}
  oar_x:      {value: 0.2, doc: oar centre distance from the keel line}
  oar_yaw:    {value: 4, doc: oars angle in toward the bow (degrees)}
  wear:       {value: 0.004}
  # derived, in the centred frame of the hull lathe (z = 0 at the lathe axis)
  z_cut:      -half_len + stern_cut
  hull_z0:    z_cut - (-1.02 * half_len + z_cut) / 2 - 1.02 * half_len / 2

materials:
  paint: {archetype: painted, color: "#3f7f9a", under_color: "#7a5434", chips: 0.45, edge_wear: 0.3, variation: 0.12, grime: 0.25, grime_height: 0.12, seed: 3}
  wood:  {archetype: wood, color: "#a4733f", grain_strength: 0.4, grain_scale: 0.035, edge_wear: 0.35, streaks: 0.5, seed: 5}

parts:
  hull:
    doc: hollow hull shell; outside painted, inside and transom inner face bare wood
    shape:
      type: lathe
      segments: hull_seg
      profile: [[0, 0], [0.55, 0], [0.8, 0.09], [0.93, 0.22], [1.0, 0.36], [1.02, depth]]
      ops: [{type: scale, factor: [half_beam, 1, half_len]}]
    ops:
      - {type: subtract, shape: {type: box, size: [3, 3, 1]}, position: [0, 0, z_cut - 0.5]}
      - type: subtract
        shape:
          type: boolean
          operation: intersection
          material: wood
          base:
            type: lathe
            segments: hull_seg
            profile: [[0, wall], [0.55, wall], [0.8, 0.09 + wall], [0.93, 0.22 + wall], [1.0, 0.36 + wall], [1.03, depth + 0.3]]
            ops: [{type: scale, factor: [half_beam - wall, 1, half_len - wall]}]
          tools:
            - {type: box, size: [3, 3, 4], translate: [0, 0, z_cut + wall + 2]}
        position: [0, (wall + 0.3) / 2, (z_cut + wall + 1.03 * (half_len - wall)) / 2]
      - {type: taper, axis: z, scale: [bow_narrow, 1, 1]}
    anchor: bottom
    position: [0, 0, 0]
    shading: flat
    material: paint

  thwart_mid:
    doc: middle seat (rowing thwart), ends buried in the hull sides
    measure:
      h: {ray: hull, from: [0, seat_y - thwart_t / 2, 0], dir: [1, 0, 0]}
    shape: {type: chamfer_box, size: [2 * h.x + 0.02, thwart_t, thwart_d], chamfer: 0.008}
    ops: [{type: jitter, amount: wear, seed: 21}]
    anchor: top
    position: [0, seat_y, 0]
    material: wood

  thwart_bow:
    doc: bow seat
    measure:
      h: {ray: hull, from: [0, seat_y - thwart_t / 2, 0.8], dir: [1, 0, 0]}
    shape: {type: chamfer_box, size: [2 * h.x + 0.02, thwart_t, thwart_d * 0.9], chamfer: 0.008}
    ops: [{type: jitter, amount: wear, seed: 22}]
    anchor: top
    position: [0, seat_y, 0.8]
    material: wood

  thwart_stern:
    doc: stern seat just ahead of the transom
    measure:
      h: {ray: hull, from: [0, seat_y - thwart_t / 2, -0.8], dir: [1, 0, 0]}
    shape: {type: chamfer_box, size: [2 * h.x + 0.02, thwart_t, thwart_d * 1.2], chamfer: 0.008}
    ops: [{type: jitter, amount: wear, seed: 23}]
    anchor: top
    position: [0, seat_y, -0.8]
    material: wood

  oar:
    doc: loom, flat blade toward the bow and a thinner grip; lying on the thwarts
    shape:
      type: boolean
      operation: union
      base: {type: cylinder, radius: oar_r, height: oar_len - blade_l - 0.12, segments: 6}
      tools:
        - type: chamfer_box
          size: [blade_w, blade_l, blade_t]
          chamfer: 0.006
          ops: [{type: taper, axis: y, scale: [0.35, 1, 0.8]}]
          rotate: [0, 0, 180]
          translate: [0, (oar_len - blade_l - 0.12) / 2 + blade_l / 2 - 0.03, 0]
        - {type: cylinder, radius: oar_r * 0.8, height: 0.15, segments: 6, translate: [0, -(oar_len - blade_l - 0.12) / 2 - 0.06, 0]}
    rotate: [90, oar_yaw, 0]
    anchor: bottom
    position: [oar_x, seat_y, -0.1]
    mirror: x
    uv: {share_instances: true}
    material: wood

collision: {mode: hull}

checks:
  - {expr: hull.size.z, min: 2.4, max: 3.0, doc: small rowing boat length}
  - {expr: hull.size.x, min: 0.9, max: 1.3, doc: beam}
  - {expr: asset.height, min: 0.4, max: 0.65}
  - {expr: oar_right.max.z, max: hull.max.z - 0.15, doc: oars stay inside the bow}
  - {expr: oar_right.min.z, min: hull.min.z + 0.05, doc: oars stay inside the stern}
