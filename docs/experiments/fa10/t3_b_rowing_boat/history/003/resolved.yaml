shapewright: 0.1
asset:
  name: rowing_boat
  kind: prop/vehicle/boat
  description: Small painted wooden rowing boat with three thwarts and two oars resting inside, for a stylized mobile lakeside
    level.
  tags:
  - wood
  - boat
  - lake
  - vehicle
profile: mobile_mid
style: stylized_lowpoly
budget:
  triangles: 1000
params:
  half_beam:
    value: 0.62
    min: 0.45
    max: 0.8
    doc: half the widest beam before the bow taper
  half_len:
    value: 1.5
    min: 1.1
    max: 1.9
    doc: half the hull length before the stern cut
  depth:
    value: 0.48
    min: 0.35
    max: 0.6
    doc: hull depth from bottom to gunwale
  wall:
    value: 0.04
    doc: hull plank thickness
  stern_cut:
    value: 0.32
    doc: how much of the rounded stern is cut off to make the transom
  bow_narrow:
    value: 0.5
    doc: x scale of the hull at the bow end (taper)
  hull_seg:
    value: 16
    doc: facets around the hull
  thwart_t:
    value: 0.045
    doc: seat plank thickness
  thwart_d:
    value: 0.22
    doc: seat plank depth along z
  seat_y:
    value: depth - 0.13
    doc: top of the thwarts
  oar_len:
    value: 2.0
    doc: overall oar length
  oar_r:
    value: 0.028
    doc: oar loom radius
  blade_l:
    value: 0.5
  blade_w:
    value: 0.16
  blade_t:
    value: 0.03
  oar_x:
    value: 0.17
    doc: oar centre distance from the keel line
  oar_yaw:
    value: -4
    doc: yaw of the right oar; negative brings the blades together toward the bow (degrees)
  wear:
    value: 0.004
  rail:
    value: 0.02
    doc: rub rail thickness proud of the hull
  rail_h:
    value: 0.06
    doc: rub rail height
  thole_z:
    value: 0.28
    doc: oarlock blocks sit this far aft... toward the stern of the mid thwart
  sheer_r:
    value: 9.0
    doc: radius of the sheer curve (smaller = gunwale rises more at the ends)
  sheer_z0:
    value: -0.05
    doc: lowest point of the sheer along the lathe z (bow rises more than the stern)
  sheer_seg:
    value: 45
    doc: odd so a flat facet sits at the lowest point of the sheer
  z_cut: -half_len + stern_cut
  slope: 0.04 / (depth - 0.34)
  lathe_h: depth + 0.3
  r_top: 0.99 + slope * (lathe_h - 0.34)
  r_in_top: 0.99 + slope * (lathe_h + 0.3 - 0.34 - wall)
  z_shift: -(z_cut + 1.05 * half_len) / 2
materials:
  paint:
    archetype: painted
    color: '#3a8fb0'
    under_color: '#8a6038'
    chips: 0.55
    edge_wear: 0.35
    edge_width: 0.02
    variation: 0.15
    grime: 0.3
    grime_height: 0.14
    seed: 3
  wood:
    archetype: wood
    color: '#b8834a'
    grain_strength: 0.38
    grain_scale: 0.06
    edge_wear: 0.4
    edge_width: 0.015
    streaks: 0.55
    knots: 0.2
    seed: 5
parts:
  hull:
    doc: 'hollow hull shell. Outside and the transom (both faces) painted; the inside and the gunwale top (cut by the sheer
      cylinder) are bare wood. Built in the lathe''s own frame (origin: keep).

      '
    shape:
      type: lathe
      segments: hull_seg
      profile:
      - - 0
        - 0
      - - 0.42
        - 0
      - - 0.72
        - 0.08
      - - 0.9
        - 0.2
      - - 0.99
        - 0.34
      - - r_top
        - lathe_h
      ops:
      - type: scale
        factor:
        - half_beam
        - 1
        - half_len
    ops:
    - type: subtract
      shape:
        type: box
        size:
        - 3
        - 3
        - 1
      position:
      - 0
      - 0
      - z_cut - 0.5
    - type: subtract
      shape:
        type: boolean
        operation: intersection
        material: wood
        base:
          type: lathe
          segments: hull_seg
          profile:
          - - 0
            - wall
          - - 0.42
            - wall
          - - 0.72
            - 0.08 + wall
          - - 0.9
            - 0.2 + wall
          - - 0.99
            - 0.34 + wall
          - - r_in_top
            - lathe_h + 0.3
          ops:
          - type: scale
            factor:
            - half_beam - wall
            - 1
            - half_len - wall
        tools:
        - type: box
          size:
          - 3
          - 3
          - 4
          translate:
          - 0
          - 0
          - z_cut + wall + 2
          material: paint
      position:
      - 0
      - (wall + 0.3) / 2
      - (z_cut + wall + r_in_top * (half_len - wall)) / 2
    - type: subtract
      shape:
        type: cylinder
        radius: sheer_r
        height: 3
        segments: sheer_seg
        rotate:
        - 0
        - 0
        - 90
        material: wood
      position:
      - 0
      - depth - lathe_h / 2 + sheer_r
      - sheer_z0
    - type: taper
      axis: z
      scale:
      - bow_narrow
      - 1
      - 1
    origin: keep
    position:
    - 0
    - 0
    - z_shift
    shading: flat
    material: paint
  rub_rail:
    doc: natural-wood rub rail hugging the outside of the gunwale along the sheer, transom to bow
    shape:
      type: lathe
      segments: hull_seg
      profile:
      - - 0
        - 0
      - - 0.42
        - 0
      - - 0.72
        - 0.08
      - - 0.9
        - 0.2
      - - 0.99
        - 0.34
      - - r_top
        - lathe_h
      ops:
      - type: scale
        factor:
        - half_beam + rail
        - 1
        - half_len + rail
    ops:
    - type: subtract
      shape:
        type: box
        size:
        - 3
        - 3
        - 1
      position:
      - 0
      - 0
      - z_cut - 0.5
    - type: subtract
      shape:
        type: lathe
        segments: hull_seg
        profile:
        - - 0
          - 0
        - - 0.42
          - 0
        - - 0.72
          - 0.08
        - - 0.9
          - 0.2
        - - 0.99
          - 0.34
        - - r_top + 0.1 * slope
          - lathe_h + 0.1
        ops:
        - type: scale
          factor:
          - half_beam - 0.003
          - 1
          - half_len - 0.003
      position:
      - 0
      - 0.05
      - 0
    - type: intersect
      shape:
        type: ring
        radius: sheer_r + rail_h - 0.012
        thickness: rail_h
        height: 3
        segments: sheer_seg
        rotate:
        - 0
        - 0
        - 90
      position:
      - 0
      - depth - lathe_h / 2 + sheer_r
      - sheer_z0
    - type: taper
      axis: z
      scale:
      - bow_narrow
      - 1
      - 1
    origin: keep
    position:
    - 0
    - 0
    - z_shift
    shading: flat
    material: wood
  thole:
    doc: chunky wooden oarlock blocks on the gunwale, just aft of the rowing thwart
    measure:
      h:
        ray: hull
        from:
        - 0
        - depth - 0.03
        - -thole_z
        dir:
        - 1
        - 0
        - 0
      g:
        ray: hull
        from:
        - h.x + wall / 2
        - 2
        - -thole_z
        dir:
        - 0
        - -1
        - 0
    shape:
      type: chamfer_box
      size:
      - 0.05
      - 0.1
      - 0.07
      chamfer: 0.01
    ops:
    - type: jitter
      amount: wear
      seed: 31
    anchor: bottom
    position:
    - h.x + wall / 2
    - g.y - 0.03
    - -thole_z
    mirror: x
    uv:
      share_instances: true
    material: wood
  thwart_mid:
    doc: middle seat (rowing thwart), ends buried in the hull sides
    measure:
      a:
        ray: hull
        from:
        - 0
        - seat_y - thwart_t / 2
        - 0 - thwart_d / 2
        dir:
        - 1
        - 0
        - 0
      b:
        ray: hull
        from:
        - 0
        - seat_y - thwart_t / 2
        - 0 + thwart_d / 2
        dir:
        - 1
        - 0
        - 0
    shape:
      type: chamfer_box
      size:
      - 2 * min(a.x
      - b.x) + 0.015
      - thwart_t
      - thwart_d
      chamfer: 0.008
    ops:
    - type: jitter
      amount: wear
      seed: 21
    anchor: top
    position:
    - 0
    - seat_y
    - 0
    material: wood
  thwart_bow:
    doc: bow seat
    measure:
      a:
        ray: hull
        from:
        - 0
        - seat_y - thwart_t / 2
        - 0.8 - thwart_d * 0.9 / 2
        dir:
        - 1
        - 0
        - 0
      b:
        ray: hull
        from:
        - 0
        - seat_y - thwart_t / 2
        - 0.8 + thwart_d * 0.9 / 2
        dir:
        - 1
        - 0
        - 0
    shape:
      type: chamfer_box
      size:
      - 2 * min(a.x
      - b.x) + 0.015
      - thwart_t
      - thwart_d * 0.9
      chamfer: 0.008
    ops:
    - type: jitter
      amount: wear
      seed: 22
    anchor: top
    position:
    - 0
    - seat_y
    - 0.8
    material: wood
  thwart_stern:
    doc: stern seat just ahead of the transom
    measure:
      a:
        ray: hull
        from:
        - 0
        - seat_y - thwart_t / 2
        - -0.8 - thwart_d * 1.2 / 2
        dir:
        - 1
        - 0
        - 0
      b:
        ray: hull
        from:
        - 0
        - seat_y - thwart_t / 2
        - -0.8 + thwart_d * 1.2 / 2
        dir:
        - 1
        - 0
        - 0
    shape:
      type: chamfer_box
      size:
      - 2 * min(a.x
      - b.x) + 0.015
      - thwart_t
      - thwart_d * 1.2
      chamfer: 0.008
    ops:
    - type: jitter
      amount: wear
      seed: 23
    anchor: top
    position:
    - 0
    - seat_y
    - -0.8
    material: wood
  oar:
    doc: loom, flat blade with painted tip toward the bow and a thinner grip; lying on the thwarts
    shape:
      type: boolean
      operation: union
      base:
        type: cylinder
        radius: oar_r
        height: oar_len - blade_l - 0.12
        segments: 6
      tools:
      - type: box
        size:
        - blade_w
        - blade_l
        - blade_t
        material: paint
        ops:
        - type: taper
          axis: y
          scale:
          - 0.35
          - 1
          - 0.8
        rotate:
        - 0
        - 0
        - 180
        translate:
        - 0
        - (oar_len - blade_l - 0.12) / 2 + blade_l / 2 - 0.03
        - 0
      - type: cylinder
        radius: oar_r * 0.8
        height: 0.15
        segments: 6
        translate:
        - 0
        - -(oar_len - blade_l - 0.12) / 2 - 0.06
        - 0
    rotate:
    - 90
    - oar_yaw
    - 0
    anchor: bottom
    position:
    - oar_x
    - seat_y - 0.005
    - -0.1
    mirror: x
    uv:
      share_instances: true
    material: wood
collision:
  mode: hull
checks:
- expr: hull.size.z
  min: 2.4
  max: 3.0
  doc: small rowing boat length
- expr: hull.size.x
  min: 0.9
  max: 1.3
  doc: beam
- expr: asset.height
  min: 0.55
  max: 0.7
  doc: gunwale rises with the sheer to its highest point at the bow
- expr: thwart_mid.max.y
  min: 0.3
  max: 0.4
  doc: seat height inside the hull
- expr: oar_right.max.z
  max: hull.max.z - 0.15
  doc: oars stay inside the bow
- expr: oar_right.min.z
  min: hull.min.z + 0.05
  doc: oars stay inside the stern
